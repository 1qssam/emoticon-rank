<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>원큐쌤의 이모티콘 클래스</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="32x32" href="1qssam-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="1qssam-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="1qssam-180.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root { --bg:#fffdf7; --card:#ffffff; --ink:#222; --sub:#666; --line:#eee3c8; --accent:#f5c518; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#17150f; --card:#221f17; --ink:#f2efe6; --sub:#aaa392; --line:#3a3424; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
    font-family:Pretendard, -apple-system, "Malgun Gothic", sans-serif; line-height:1.6; }
  main { max-width:480px; margin:0 auto; padding:56px 16px; text-align:center; }
  img { width:120px; height:auto; }
  h1 { font-size:22px; margin:20px 0 8px; }
  p { color:var(--sub); margin:0 0 28px; }
  nav { display:flex; flex-direction:column; gap:10px; }
  nav a { display:block; padding:14px; border:1px solid var(--line); border-radius:12px;
    background:var(--card); color:var(--ink); text-decoration:none; font-weight:600; }
  nav a:hover { border-color:var(--accent); }
</style>
</head>
<body>
<main>
  <img src="1qssam-character-1.png" alt="원큐쌤 캐릭터">
  <h1>순위 데이터는 잠시 쉬어요</h1>
  <p>이모티콘 순위·신규 기록 페이지는 이용 기준을 확인하는 동안 잠시 닫아 두었어요.<br>강의 일정과 GIF 만들기는 그대로 쓸 수 있어요.</p>
  <nav>
    <a href="class.html">강의 일정 보기</a>
    <a href="gif-maker.html">GIF 만들기</a>
  </nav>
</main>
</body>
</html>
