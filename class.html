<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>강의 일정 · 원큐쌤의 이모티콘 클래스</title>
<link rel="icon" type="image/png" sizes="32x32" href="1qssam-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="1qssam-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="1qssam-180.png">
<meta name="description" content="원큐쌤의 오프라인 이모티콘 강의 일정입니다. 회차별 날짜와 장소를 보고 신청할 수 있습니다.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="이모티콘 순위">
<meta property="og:title" content="강의 일정 · 원큐쌤의 이모티콘 클래스">
<meta property="og:description" content="원큐쌤의 오프라인 이모티콘 강의 일정입니다. 회차별 날짜와 장소를 보고 신청할 수 있습니다.">
<meta property="og:image" content="https://1qssam.github.io/emoticon-rank/1qssam-share.png">
<meta property="og:url" content="https://1qssam.github.io/emoticon-rank/class.html">
<meta name="twitter:card" content="summary_large_image">
<style>
  :root{--paper:#fcfcfb;--ink:#17181a;--muted:#83878c;--line:#e7e6e1;--panel:#f5f4f0;--mark:#fee500}
  *{box-sizing:border-box}
  html{overflow-y:scroll}
  html,body{margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic",sans-serif;
    font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1000px;margin:0 auto;padding:24px 20px 80px}
  header{display:flex;align-items:baseline;gap:10px;margin-bottom:18px;flex-wrap:wrap}
  h1{font-size:17px;font-weight:600;margin:0;letter-spacing:-.01em}
  .since{font-size:12px;color:var(--muted)}
  .since a{color:var(--muted);text-decoration:none}
  .since a:hover{color:var(--ink);text-decoration:underline}
  .nav{margin-left:auto;display:flex;gap:14px}
  .nav a{font-size:13px;color:var(--muted);text-decoration:none}
  .nav a:hover{color:var(--ink);text-decoration:underline}
  .nav a[aria-current]{color:var(--ink);font-weight:600}

  .topbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
  .monthnav{display:flex;align-items:center;gap:8px}
  .daynav{width:30px;height:30px;border:1px solid var(--line);background:#fff;border-radius:7px;
    cursor:pointer;font-size:14px;color:var(--ink);line-height:1}
  .daynav:disabled{color:#cfcdc7;cursor:default}
  .month{font-size:16px;font-weight:600;letter-spacing:-.01em;min-width:104px;text-align:center}
  .today{border:1px solid var(--line);background:#fff;border-radius:7px;padding:5px 11px;
    font-size:12.5px;font-family:inherit;color:var(--ink);cursor:pointer}
  .today:hover{border-color:var(--ink)}
  .views{margin-left:auto;display:flex;gap:2px}
  .viewbtn{border:1px solid var(--line);background:#fff;padding:5px 13px;border-radius:999px;
    font-size:13px;color:var(--muted);cursor:pointer;font-family:inherit}
  .viewbtn[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);font-weight:600}

  /* ── 달력 ── */
  .cal{border:1px solid var(--line);border-radius:10px;background:#fff;overflow:hidden}
  .dows{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));background:var(--panel);
    border-bottom:1px solid var(--line)}
  .dows span{font-size:12px;color:var(--muted);text-align:center;padding:7px 0}
  .dows span:first-child{color:#c2564b}
  .dows span:last-child{color:#3a6fb0}
  .weeks{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
  .day{min-height:132px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);
    padding:6px 5px;display:flex;flex-direction:column;gap:3px}
  .day:nth-child(7n){border-right:0}
  .day.off{background:#fbfaf7}
  .day .d{font-size:12.5px;color:#5c6064;padding:0 2px 1px}
  .day.off .d{color:#c2c0ba}
  .day.sun .d{color:#c2564b}
  .day.sat .d{color:#3a6fb0}
  .day.now .d{background:var(--ink);color:#fff;border-radius:999px;padding:1px 6px;
    display:inline-block;width:fit-content;font-weight:600}
  .chip{border:0;border-left:3px solid;background:none;font-family:inherit;text-align:left;cursor:pointer;
    padding:3px 5px 3px 6px;border-radius:0 5px 5px 0;font-size:11.5px;line-height:1.35;
    display:flex;gap:5px;align-items:baseline;width:100%;color:var(--ink)}
  .chip:hover{filter:brightness(.96)}
  .chip .t{color:#4c5054;flex:none;font-size:11px}
  .chip .n{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
  .chip.past{opacity:.45}

  .legend{display:flex;gap:12px;flex-wrap:wrap;padding:12px 2px 0}
  .legend button{border:0;background:none;font-family:inherit;font-size:12.5px;color:#4c5054;
    cursor:pointer;display:flex;align-items:center;gap:6px;padding:2px 0}
  .legend button:hover{color:var(--ink);text-decoration:underline}

  /* ── 목록 ── */
  .list{border-top:1px solid var(--line)}
  .item{display:grid;grid-template-columns:170px 1fr auto;gap:14px;align-items:baseline;
    padding:11px 4px;border-bottom:1px solid var(--line)}
  .item:hover{background:#faf9f6}
  .when{font-size:13px;color:#43464a}
  .when b{font-weight:600;margin-right:6px}
  .mark{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:4px;
    padding:1px 5px;margin-left:5px;white-space:nowrap}
  .what{min-width:0}
  .what button{border:0;background:none;font-family:inherit;font-size:15px;font-weight:500;
    color:var(--ink);cursor:pointer;padding:0;text-align:left;display:flex;gap:7px;align-items:center}
  .what button:hover{text-decoration:underline}
  .dot{width:9px;height:9px;border-radius:50%;flex:none}
  .where{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .nth{font-size:12.5px;color:var(--muted);white-space:nowrap}
  .empty{padding:48px 0;text-align:center;color:var(--muted);font-size:13.5px}

  /* ── 강의 상세 ── */
  dialog{border:0;border-radius:12px;padding:0;max-width:400px;width:calc(100% - 32px);
    box-shadow:0 14px 44px rgba(0,0,0,.18);color:var(--ink)}
  dialog::backdrop{background:rgba(23,24,26,.34)}
  .sheet{padding:20px 20px 18px}
  .sheet .band{height:4px;border-radius:999px;width:38px;margin-bottom:13px}
  .sheet h2{font-size:17px;margin:0 0 3px;font-weight:600;letter-spacing:-.01em}
  .sheet .place{font-size:13.5px;color:var(--muted);margin:0 0 14px}
  .sheet .note{font-size:13.5px;color:#4c5054;margin:0 0 14px;line-height:1.6}
  .rounds{list-style:none;margin:0 0 16px;padding:0;border-top:1px solid var(--line)}
  .rounds li{display:flex;gap:9px;align-items:baseline;padding:7px 2px;
    border-bottom:1px solid var(--line);font-size:13.5px}
  .rounds .no{color:var(--muted);font-size:12.5px;width:28px;flex:none}
  .rounds .done{opacity:.42}
  .rounds .done .rdate::after{content:" 종료";font-size:11.5px;color:var(--muted)}
  .btns{display:flex;gap:8px}
  .btn{flex:1;text-align:center;font-family:inherit;font-size:13.5px;padding:9px 0;border-radius:8px;
    border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;text-decoration:none}
  .btn:hover{border-color:var(--ink)}
  .btn.solid{background:var(--ink);color:#fff;border-color:var(--ink)}

  .foot{margin-top:44px;padding-top:18px;border-top:1px solid var(--line);
    font-size:12.5px;color:var(--muted);line-height:1.7}
  .foot p{margin:0 0 4px}
  .foot .slot{margin-top:8px}
  .foot .slot a{color:var(--ink);text-decoration:none;font-weight:500;border-bottom:1px solid var(--line)}
  .foot .slot a:hover{border-color:var(--ink)}
  button:focus-visible,a:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

  @media (max-width:640px){
    .wrap{padding:20px 12px 60px}
    .day{min-height:74px;padding:4px 3px;gap:2px}
    .day .d{font-size:11.5px}
    .chip{display:block;overflow:hidden;padding:2px 4px;font-size:10.5px}
    .chip .t{display:block;font-size:10px}
    .chip .n{display:block}
    .item{grid-template-columns:112px 1fr;gap:8px}
    .where{grid-column:2;white-space:normal}
    .nth{display:none}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>강의 일정</h1>
    <span class="since">원큐쌤의 이모티콘 클래스</span>
    <nav class="nav">
      <a href="index.html">인기 순위</a>
      <a href="new.html">신규 이모티콘</a>
      <a href="class.html" aria-current="page">강의 일정</a>
    </nav>
  </header>

  <div class="topbar">
    <div class="monthnav">
      <button class="daynav" id="prev" aria-label="이전 달">‹</button>
      <span class="month" id="month"></span>
      <button class="daynav" id="next" aria-label="다음 달">›</button>
    </div>
    <button class="today" id="todaybtn">오늘</button>
    <div class="views">
      <button class="viewbtn" id="v-cal">달력</button>
      <button class="viewbtn" id="v-list">목록</button>
    </div>
  </div>

  <div id="view"></div>

  <dialog id="sheet"><div class="sheet" id="sheetbody"></div></dialog>

  <footer class="foot">
    <p>오프라인 강의 일정입니다. 일정은 사정에 따라 바뀔 수 있습니다.</p>
    <p class="slot"><a href="https://litt.ly/1qssam" target="_blank" rel="noopener">원큐클래스 박원규(원큐쌤)</a></p>
  </footer>
</div>

<script src="classes.js"></script>
<script>
const C = (window.CLASSES || []);
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const DOW = "일월화수목금토";
const pad = n => String(n).padStart(2, "0");

/* 오늘 (한국 기준) */
const todayStr = new Date(Date.now() + 9*3600*1000).toISOString().slice(0, 10);

/* 모든 회차를 한 줄씩 펼칩니다 */
const ROUNDS = [];
C.forEach((c, ci) => {
  (c.sessions || []).slice().sort().forEach((s, n) => {
    const [date, time] = String(s).split(" ");
    const [t1, t2] = String(time || "").split("-");
    ROUNDS.push({ ci, date, time: t1 || "", end: t2 || "", n: n + 1, of: c.sessions.length });
  });
});
ROUNDS.sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));

const byDate = {};
ROUNDS.forEach(r => (byDate[r.date] = byDate[r.date] || []).push(r));

/* 보이는 달: 다음 일정이 있는 달, 없으면 이번 달 */
const upcoming = ROUNDS.find(r => r.date >= todayStr);
let cursor = (upcoming ? upcoming.date : todayStr).slice(0, 7);
let view = "cal";

$("prev").onclick = () => { cursor = shift(cursor, -1); render(); };
$("next").onclick = () => { cursor = shift(cursor, +1); render(); };
$("todaybtn").onclick = () => { cursor = todayStr.slice(0, 7); render(); };
$("v-cal").onclick = () => { view = "cal"; render(); };
$("v-list").onclick = () => { view = "list"; render(); };

function shift(ym, by){
  let [y, m] = ym.split("-").map(Number);
  m += by;
  if (m < 1){ m = 12; y--; }
  if (m > 12){ m = 1; y++; }
  return `${y}-${pad(m)}`;
}

function fmtDay(date){
  const [y, m, d] = date.split("-").map(Number);
  return `${m}월 ${d}일 ${DOW[new Date(y, m-1, d).getDay()]}`;
}

/* ── 달력 ── */
function calendar(){
  const [y, m] = cursor.split("-").map(Number);
  const first = new Date(y, m-1, 1);
  const start = new Date(y, m-1, 1 - first.getDay());     // 그 주 일요일부터
  const last = new Date(y, m, 0).getDate();
  const weeks = Math.ceil((first.getDay() + last) / 7);

  let cells = "";
  for (let i = 0; i < weeks * 7; i++){
    const d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
    const date = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
    const cls = ["day"];
    if (date.slice(0, 7) !== cursor) cls.push("off");
    if (d.getDay() === 0) cls.push("sun");
    if (d.getDay() === 6) cls.push("sat");
    if (date === todayStr) cls.push("now");

    const chips = (byDate[date] || []).map(r => {
      const c = C[r.ci];
      const mark = r.n === 1 ? " (시작)" : r.n === r.of && r.of > 1 ? " (종료)" : "";
      return `<button class="chip${date < todayStr ? " past" : ""}" data-c="${r.ci}"
        style="background:${esc(c.color)}1a;border-left-color:${esc(c.color)}"
        title="${esc(c.name + mark)}">
        <span class="t">${esc(r.time)}</span><span class="n">${esc(c.name)}${mark}</span></button>`;
    }).join("");

    cells += `<div class="${cls.join(" ")}"><span class="d">${d.getDate()}</span>${chips}</div>`;
  }

  // 이 달에 회차가 있는 강의만 아래에 색으로 알려줍니다
  const shown = [...new Set(ROUNDS.filter(r => r.date.slice(0, 7) === cursor).map(r => r.ci))];
  const legend = shown.length ? `<div class="legend">` + shown.map(ci =>
    `<button data-c="${ci}"><span class="dot" style="background:${esc(C[ci].color)}"></span>${esc(C[ci].name)}</button>`
  ).join("") + `</div>` : "";

  return `<div class="cal">
    <div class="dows">${[..."일월화수목금토"].map(x => `<span>${x}</span>`).join("")}</div>
    <div class="weeks">${cells}</div>
  </div>${legend}`;
}

/* ── 목록 (다가오는 순서) ── */
function listview(){
  const rows = ROUNDS.filter(r => r.date >= todayStr);
  if (!rows.length)
    return `<div class="empty">예정된 강의가 없습니다.</div>`;

  return `<div class="list">` + rows.map(r => {
    const c = C[r.ci];
    return `<div class="item">
      <span class="when"><b>${esc(fmtDay(r.date))}</b>${esc(r.time)}${r.end ? esc("–" + r.end) : ""}</span>
      <span class="what">
        <button data-c="${r.ci}"><span class="dot" style="background:${esc(c.color)}"></span>${esc(c.name)}${
          r.n === 1 ? `<span class="mark">시작</span>`
          : r.n === r.of && r.of > 1 ? `<span class="mark">종료</span>` : ""}</button>
        <span class="where">${esc(c.place)}</span>
      </span>
      <span class="nth">${r.n}/${r.of}회차</span>
    </div>`;
  }).join("") + `</div>`;
}

/* ── 강의 상세 ── */
function openSheet(ci){
  const c = C[ci];
  const list = (c.sessions || []).slice().sort();
  const rounds = list.map((s, i) => {
    const [date, time] = String(s).split(" ");
    const when = String(time || "").replace("-", "–");
    const mark = i === 0 ? `<span class="mark">시작</span>`
      : i === list.length - 1 && list.length > 1 ? `<span class="mark">종료</span>` : "";
    return `<li class="${date < todayStr ? "done" : ""}">
      <span class="no">${i + 1}회</span>
      <span class="rdate">${esc(fmtDay(date))} ${esc(when)}</span>${mark}</li>`;
  }).join("");

  $("sheetbody").innerHTML = `
    <div class="band" style="background:${esc(c.color)}"></div>
    <h2>${esc(c.name)}</h2>
    <p class="place">${esc(c.place)}</p>
    ${c.note ? `<p class="note">${esc(c.note)}</p>` : ""}
    <ul class="rounds">${rounds}</ul>
    <div class="btns">
      <button class="btn" id="closebtn">닫기</button>
      ${c.link ? `<a class="btn solid" href="${esc(c.link)}" target="_blank" rel="noopener">신청하기</a>` : ""}
    </div>`;
  $("closebtn").onclick = () => $("sheet").close();
  $("sheet").showModal();
}

function render(){
  const [y, m] = cursor.split("-").map(Number);
  $("month").textContent = `${y}년 ${m}월`;
  $("v-cal").setAttribute("aria-pressed", view === "cal");
  $("v-list").setAttribute("aria-pressed", view === "list");
  // 달 이동은 달력에서만 의미가 있습니다
  document.querySelector(".monthnav").style.visibility = view === "cal" ? "" : "hidden";
  $("todaybtn").style.visibility = view === "cal" ? "" : "hidden";

  $("view").innerHTML = view === "cal" ? calendar() : listview();
  $("view").querySelectorAll("[data-c]").forEach(b => b.onclick = () => openSheet(+b.dataset.c));
}

render();
</script>
<script data-goatcounter="https://emoticon-rank.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
</body>
</html>
