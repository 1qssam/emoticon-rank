<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>이모티콘 순위</title>
<link rel="icon" type="image/png" sizes="32x32" href="1qssam-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="1qssam-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="1qssam-180.png">
<meta name="description" content="카카오 이모티콘 인기 순위를 날짜별로 기록합니다. 연령대별 순위와 기간별 순위 변동을 볼 수 있습니다.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="이모티콘 순위">
<meta property="og:title" content="이모티콘 순위">
<meta property="og:description" content="카카오 이모티콘 인기 순위를 날짜별로 기록합니다. 연령대별 순위와 기간별 순위 변동을 볼 수 있습니다.">
<meta property="og:image" content="https://1qssam.github.io/emoticon-rank/1qssam-share.png">
<meta property="og:url" content="https://1qssam.github.io/emoticon-rank/">
<meta name="twitter:card" content="summary_large_image">
<style>
  :root{
    --paper:#fcfcfb; --ink:#17181a; --muted:#83878c; --line:#e7e6e1;
    --up:#d63b2f; --down:#2563c9; --flat:#b6b4ae;
    --mark:#fee500; --panel:#f5f4f0;
  }
  *{box-sizing:border-box}
  html{overflow-y:scroll}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic",sans-serif;
    font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1320px;margin:0 auto;padding:24px 20px 80px}
  header{display:flex;align-items:baseline;gap:10px;margin-bottom:18px;flex-wrap:wrap}
  .nav{margin-left:auto;display:flex;gap:14px}
  .nav a{font-size:13px;color:var(--muted);text-decoration:none}
  .nav a:hover{color:var(--ink);text-decoration:underline}
  .nav a[aria-current]{color:var(--ink);font-weight:600}
  h1{font-size:17px;font-weight:600;margin:0;letter-spacing:-.01em}
  .since{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

  .topbar{display:flex;align-items:center;gap:14px;margin-bottom:14px;flex-wrap:wrap}
  .datebar{display:flex;align-items:center;gap:8px;position:relative}
  .daynav{width:30px;height:30px;border:1px solid var(--line);background:#fff;border-radius:7px;
    cursor:pointer;font-size:14px;color:var(--ink);line-height:1}
  .daynav:disabled{color:#cfcdc7;cursor:default}
  .todaybtn{border:0;background:none;font-family:inherit;cursor:pointer;padding:2px 6px;border-radius:6px;
    font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.01em;color:var(--ink)}
  .todaybtn:hover{background:#f0efea}
  .dow{font-size:13px;color:var(--muted);font-weight:400;margin-left:4px}

  #picker{position:absolute;top:38px;left:34px;z-index:30;background:#fff;border:1px solid var(--line);
    border-radius:10px;padding:12px;box-shadow:0 8px 26px rgba(0,0,0,.1);width:266px}
  #picker input[type=date]{font-family:inherit;font-size:14px;border:1px solid var(--line);
    border-radius:7px;padding:6px 8px;width:100%;margin-bottom:10px}
  .calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
  .calhead b{font-size:13.5px;font-variant-numeric:tabular-nums}
  .calnav{width:26px;height:26px;border:1px solid var(--line);background:#fff;border-radius:6px;
    cursor:pointer;font-size:12px;line-height:1;color:var(--ink)}
  .calnav:disabled{color:#d5d3cd;cursor:default}
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
  .cal span.h{font-size:11px;color:var(--muted);text-align:center;padding:3px 0}
  .cal button{border:0;background:none;font-family:inherit;font-size:12.5px;padding:6px 0;border-radius:6px;
    cursor:pointer;color:var(--ink);font-variant-numeric:tabular-nums}
  .cal button:disabled{color:#d5d3cd;cursor:default}
  .cal button.sel{background:var(--ink);color:#fff;font-weight:600}
  .cal button:not(:disabled):not(.sel):hover{background:#f0efea}

  .search{position:relative;flex:1;min-width:200px;max-width:340px}
  .search input{width:100%;font-family:inherit;font-size:13.5px;padding:7px 28px 7px 11px;
    border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
  .search input::placeholder{color:#b3b1ab}
  .search .x{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;
    cursor:pointer;color:var(--muted);font-size:13px;padding:2px 4px;border-radius:4px}

  .ages{display:flex;gap:2px;margin-bottom:14px;flex-wrap:wrap}
  .agebtn{border:1px solid var(--line);background:#fff;padding:5px 12px;border-radius:999px;
    font-size:13px;color:var(--muted);cursor:pointer;font-family:inherit}
  .agebtn[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);font-weight:600}

  .main{display:grid;grid-template-columns:1fr;gap:22px;align-items:start}
  .main.split{grid-template-columns:minmax(0,1fr) 470px}

  .resulthead{font-size:13px;color:var(--muted);padding:2px 0 8px}
  .hint{font-size:12.5px;color:var(--muted);margin:-4px 0 12px}
  .list{border-top:1px solid var(--line)}
  .row{display:grid;grid-template-columns:22px 40px 44px 1fr auto auto;
    align-items:center;gap:10px;padding:8px 4px;border-bottom:1px solid var(--line)}
  .row.found{grid-template-columns:22px 44px 1fr auto}
  .row:hover{background:#faf9f6}
  .rank{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;text-align:right;color:#43464a}
  .thumb{width:44px;height:44px;border-radius:8px;background:#f0efea;object-fit:cover;display:block}
  .name{min-width:0}
  .title{display:block;font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
  .title a{color:inherit;text-decoration:none}
  .title a:hover{text-decoration:underline}
  .by{display:block;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .by a{color:#63676b;text-decoration:none;font-weight:500}
  .by a:hover{text-decoration:underline}
  .sep{color:#cfcdc7;margin:0 5px}
  .move{font-size:12.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
  .up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--flat)}
  .badge{font-size:11px;padding:2px 6px;border-radius:4px;background:var(--mark);
    color:#3a3400;font-weight:600;white-space:nowrap}
  .go{color:#b9b7b1;text-decoration:none;font-size:13px;padding:2px 4px}
  .go:hover{color:var(--ink)}
  .tag{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:1px 5px}
  .tag-sound{display:inline-flex;align-items:center;gap:3px}
  .sound{width:11px;height:11px;display:inline-block;vertical-align:-1px}
  .released{font-variant-numeric:tabular-nums}
  input[type=checkbox]{width:14px;height:14px;accent-color:#17181a;cursor:pointer}
  .empty{padding:44px 0;text-align:center;color:var(--muted);font-size:13.5px}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px;
    position:sticky;top:16px}
  .panel h2{font-size:14.5px;margin:0 0 12px;font-weight:600}
  .ctrl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:9px}
  .ctrl select{font-family:inherit;font-size:13.5px;border:1px solid var(--line);border-radius:6px;
    padding:5px 6px;background:#fff;color:var(--ink)}
  .presets{display:flex;gap:5px;flex-wrap:wrap}
  .preset{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;
    font-size:13px;color:var(--muted);cursor:pointer;font-family:inherit}
  .preset:hover{border-color:var(--ink);color:var(--ink)}
  .note{font-size:12.5px;color:var(--muted);margin-bottom:6px}

  .agesel{margin-bottom:10px}
  .agesel summary{list-style:none;display:inline-flex;align-items:center;gap:7px;cursor:pointer;
    border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px;font-size:13.5px}
  .agesel summary::-webkit-details-marker{display:none}
  .agesel summary:hover{border-color:var(--ink)}
  .caret{display:inline-block;transition:transform .15s;font-size:10px;color:var(--muted)}
  .agesel[open] .caret{transform:rotate(90deg)}
  .agecount{color:var(--muted);font-size:12.5px}
  .agebox{display:flex;flex-wrap:wrap;gap:7px 16px;padding:10px 4px 2px}
  .agebox label{display:flex;align-items:center;gap:6px;font-size:13.5px;cursor:pointer}

  .legend{display:flex;flex-direction:column;gap:5px;margin-top:12px}
  .leg{display:flex;align-items:center;gap:8px;font-size:13px;background:#fff;
    border:1px solid var(--line);border-radius:8px;padding:5px 8px 5px 10px}
  .leg.off{opacity:.45}
  .legname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:150px;flex:1}
  .dot{width:10px;height:10px;border-radius:2px;flex:none}
  .legbtn{border:0;background:none;cursor:pointer;font-size:13px;padding:1px 3px;line-height:1;border-radius:4px}
  .legbtn:hover{background:#f0efea}
  .dashkey{display:flex;gap:12px;flex-wrap:wrap;margin-top:9px;font-size:12.5px;color:var(--muted)}
  .panelhead{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .panelx{border:0;background:none;cursor:pointer;color:var(--muted);font-size:14px;
    padding:3px 6px;border-radius:6px;line-height:1}
  .panelx:hover{background:#e9e7e1;color:var(--ink)}
  .chartwrap{position:relative}
  .tip{position:absolute;pointer-events:none;transition:top .08s linear;background:#fff;border:1px solid var(--line);
    border-radius:8px;padding:8px 10px;font-size:12.5px;box-shadow:0 4px 14px rgba(0,0,0,.1);
    width:auto;min-width:150px;max-width:230px;z-index:5}
  .tip b{display:block;font-size:12px;color:var(--muted);font-weight:500;margin-bottom:5px;
    font-variant-numeric:tabular-nums}
  .tiprow{display:flex;align-items:center;gap:6px;line-height:1.7}
  .tiprow span.v{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
  .foot{margin-top:44px;padding-top:18px;border-top:1px solid var(--line);
    font-size:12.5px;color:var(--muted);line-height:1.7}
  .foot p{margin:0 0 4px}
  .foot .slot{margin-top:8px}
  .foot .slot a{color:var(--ink);text-decoration:none;font-weight:500;border-bottom:1px solid var(--line)}
  .foot .slot a:hover{border-color:var(--ink)}
  #chart svg{display:block;width:100%;height:auto}
  .leg svg,.tiprow svg,.dashkey svg{display:inline-block;vertical-align:middle;flex:none}
  button:focus-visible,select:focus-visible,a:focus-visible,summary:focus-visible,input:focus-visible{
    outline:2px solid var(--ink);outline-offset:2px}
  /* 위아래 이동 버튼 */
  .scrollbtns{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:6px;z-index:50}
  .scrollbtns button{width:38px;height:38px;border:1px solid var(--line);background:#fff;border-radius:10px;
    cursor:pointer;font-size:15px;color:#5c6064;line-height:1;box-shadow:0 2px 8px rgba(0,0,0,.06)}
  .scrollbtns button:hover{border-color:var(--ink);color:var(--ink)}
  .sheettoggle{display:none;border:0;background:none;cursor:pointer;color:var(--muted);
    font-size:13px;padding:3px 6px;border-radius:6px;line-height:1;font-family:inherit}
  .sheettoggle:hover{background:#e9e7e1;color:var(--ink)}

  @media (max-width:1000px){
    .main.split{grid-template-columns:1fr}
    .panel{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:40;
      max-height:62vh;overflow-y:auto;border-radius:14px 14px 0 0;border-bottom:0;
      padding:12px 14px 18px;box-shadow:0 -6px 24px rgba(0,0,0,.13)}
    .panel .panelhead{position:sticky;top:0;background:var(--panel);z-index:1;padding:2px 0 6px;margin:0}
    .panel.collapsed{max-height:none;overflow:visible}
    .panel.collapsed > *:not(.panelhead){display:none}
    .sheettoggle{display:inline-flex}
  }
  @media (max-width:820px){
    .row{grid-template-columns:18px 26px 40px minmax(0,1fr) auto;gap:9px;padding:11px 2px;
      align-items:start}
    .row.found{grid-template-columns:18px 40px minmax(0,1fr)}
    .go{display:none}
    .rank{padding-top:1px}
    .thumb{width:40px;height:40px}
    /* 제목이 잘리지 않게 두 줄까지 풀어줍니다 */
    .title{white-space:normal;overflow:visible;line-height:1.35;
      display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .by{white-space:normal;line-height:1.45;margin-top:2px}
    .move{padding-top:2px}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>이모티콘 순위</h1>
    <span class="since" id="since"></span>
    <nav class="nav">
      <a href="index.html" aria-current="page">인기 순위</a>
      <a href="new.html">신규 이모티콘</a>
    </nav>
  </header>

  <div class="topbar">
    <div class="datebar">
      <button class="daynav" id="prev" aria-label="이전 날짜">‹</button>
      <button class="todaybtn" id="todaybtn" aria-haspopup="dialog"></button>
      <button class="daynav" id="next" aria-label="다음 날짜">›</button>
      <div id="picker" hidden>
        <input type="date" id="dateinput" aria-label="날짜 직접 입력">
        <div class="calhead">
          <button class="calnav calprev" aria-label="이전 달">‹</button>
          <b class="calmonth"></b>
          <button class="calnav calnext" aria-label="다음 달">›</button>
        </div>
        <div class="cal"></div>
      </div>
    </div>

    <div class="search">
      <input id="q" type="search" placeholder="작가명 · 상품명 검색" autocomplete="off">
      <button class="x" id="qx" hidden aria-label="검색어 지우기">✕</button>
    </div>
  </div>

  <div class="ages" id="ages"></div>
  <p class="hint">당일 출시된 이모티콘은 이 순위에 아직 반영되지 않습니다.</p>

  <div class="main" id="main">
    <div>
      <div class="resulthead" id="resulthead" hidden></div>
      <div class="list" id="list"></div>
    </div>

    <div class="panel" id="panel" hidden>
      <div class="panelhead">
        <h2>기간별 순위 변동</h2>
        <span style="margin-left:auto"></span>
        <button class="sheettoggle" id="sheettoggle" aria-label="펼치기/접기">▾ 접기</button>
        <button class="panelx" id="panelx" aria-label="순위 변동 닫기">✕</button>
      </div>
      <div class="note">비교는 한 번에 5개까지 표시할 수 있습니다.</div>

      <div class="ctrl">
        <span><select id="sy"></select><select id="sm"></select><select id="sd"></select></span>
        <span class="note" style="margin:0">–</span>
        <span><select id="ey"></select><select id="em"></select><select id="ed"></select></span>
      </div>
      <div class="ctrl">
        <span class="presets">
          <button class="preset" data-days="7">일주일</button>
          <button class="preset" data-days="30">30일</button>
          <button class="preset" data-days="60">60일</button>
          <button class="preset" data-days="90">90일</button>
        </span>
      </div>

      <details class="agesel" id="agesel">
        <summary><span class="caret">▶</span>연령대 <span class="agecount" id="agecount"></span></summary>
        <div class="agebox" id="agebox"></div>
      </details>

      <div class="note" id="rangenote"></div>
      <div class="chartwrap"><div id="chart"></div><div class="tip" id="tip" hidden></div></div>
      <div class="dashkey" id="dashkey"></div>
      <div class="legend" id="legend"></div>
    </div>
  </div>

  <div class="scrollbtns" id="scrollbtns">
    <button id="toTop" aria-label="맨 위로">↑</button>
    <button id="toBottom" aria-label="맨 아래로">↓</button>
  </div>

  <footer class="foot">
    <p>카카오 이모티콘샵에 공개된 순위를 매일 기록합니다. 이미지와 이모티콘에 대한 권리는 각 저작권자에게 있습니다.</p>
    <p>인기 순위는 매일 아침, 신규 출시는 오전 중에 수집합니다. <span id="updated"></span></p>
    <p class="slot"><a href="https://litt.ly/1qssam" target="_blank" rel="noopener">원큐클래스 박원규(원큐쌤)</a></p>
  </footer>
</div>

<script src="data.js"></script>
<script src="common.js"></script>
<script>
const D = window.DATA;
const COLORS = ["#0072b2","#e69f00","#009e73","#cc79a7","#333333"];  // 색약에서도 구분되는 조합
const SHAPES = ["circle","square","triangle","diamond","cross"];
const MAX_PICK = 5;
const DASH = {"전체":"", "10대":"6 3", "20대":"2 3", "30대":"9 3 2 3", "40대":"12 4", "50대이상":"1 4"};
const MAX_DAYS = 90, MAX_FOUND = 120;

let dateIdx = D.dates.length - 1;
let age = D.ages[0];
let chartAges = [D.ages[0]];
let picked = [];
let from = 0, to = D.dates.length - 1;
let query = "";
let calYM = D.dates.at(-1).slice(0, 7);

const $ = id => document.getElementById(id);
const meta = i => D.items[i];
const dow = s => "일월화수목금토"[new Date(...s.split("-").map((v,i)=>i===1?v-1:+v)).getDay()];
const fmt = s => { const [y,m,d] = s.split("-"); return `${y}년 ${+m}월 ${+d}일`; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const dateSet = new Set(D.dates);

$("since").textContent = "since " + D.dates[0].replace(/-/g,"").slice(2);
if (D.generatedAt) $("updated").textContent = `마지막 갱신 ${D.generatedAt}`;

/* 연령대 (목록) */
D.ages.forEach(a => {
  const b = document.createElement("button");
  b.className = "agebtn"; b.textContent = a; b.dataset.age = a;
  b.onclick = () => { age = a; render(); };
  $("ages").appendChild(b);
});

/* 연령대 (그래프) */
D.ages.forEach(a => {
  const l = document.createElement("label");
  l.innerHTML = `<input type="checkbox" value="${a}" ${chartAges.includes(a)?"checked":""}>${a}`;
  l.querySelector("input").onchange = e => {
    if (e.target.checked) chartAges.push(a);
    else chartAges = chartAges.filter(v => v !== a);
    if (!chartAges.length){ chartAges = [a]; e.target.checked = true; }
    render();
  };
  $("agebox").appendChild(l);
});

/* 날짜 */
$("prev").onclick = () => { dateIdx--; render(); };
$("next").onclick = () => { dateIdx++; render(); };
initDatePicker({
  dates: D.dates, button: "todaybtn", picker: "picker",
  get: () => dateIdx,
  set: k => { dateIdx = k; render(); },
});

/* 검색 */
$("q").oninput = e => { query = e.target.value.trim(); $("qx").hidden = !query; render(); };
$("qx").onclick = () => { query = ""; $("q").value = ""; $("qx").hidden = true; render(); };

/* 기간 */
const ymd = s => s.split("-");
function fillPeriod(){
  const years = [...new Set(D.dates.map(d => ymd(d)[0]))];
  const build = (sel, list, val) => {
    sel.innerHTML = list.map(v => `<option value="${v}">${+v}</option>`).join("");
    if (list.includes(val)) sel.value = val;
  };
  [["s", from], ["e", to]].forEach(([p, idx]) => {
    const [y,m,d] = ymd(D.dates[idx]);
    build($(p+"y"), years, y);
    const ms = [...new Set(D.dates.filter(x => ymd(x)[0] === $(p+"y").value).map(x => ymd(x)[1]))];
    build($(p+"m"), ms, m);
    const ds = [...new Set(D.dates.filter(x => ymd(x)[0] === $(p+"y").value && ymd(x)[1] === $(p+"m").value).map(x => ymd(x)[2]))];
    build($(p+"d"), ds, d);
  });
}
["s","e"].forEach(p => ["y","m","d"].forEach(k => {
  $(p+k).onchange = () => {
    const want = `${$(p+"y").value}-${$(p+"m").value}-${$(p+"d").value}`;
    let j = D.dates.indexOf(want);
    if (j < 0){ j = D.dates.findIndex(x => x >= want); if (j < 0) j = D.dates.length - 1; }
    if (p === "s") from = j; else to = j;
    if (from > to) [from, to] = [to, from];
    clampRange(); render();
  };
}));
document.querySelectorAll(".preset").forEach(b => b.onclick = () => {
  to = D.dates.length - 1;
  from = Math.max(0, to - (+b.dataset.days) + 1);
  render();
});
function clampRange(){
  const span = () => (new Date(D.dates[to]) - new Date(D.dates[from])) / 86400000;
  if (span() > MAX_DAYS){
    while (from < to && span() > MAX_DAYS) from++;
    $("rangenote").textContent = `기간은 최대 ${MAX_DAYS}일까지 볼 수 있습니다.`;
  } else $("rangenote").textContent = "";
}

/* 목록 */
function toggle(i){
  const at = picked.findIndex(p => p.id === i);
  if (at >= 0) picked.splice(at, 1);
  else if (picked.length < MAX_PICK) picked.push({id:i, on:true});
  render();
}

function rowEl(i, rank, move, isNew, found){
  const [slug, title, creator, cid, flags, thumb] = meta(i);
  const link = `https://e.kakao.com/app/t/${slug}`;
  const el = document.createElement("div");
  el.className = "row" + (found ? " found" : "");
  const r = D.release[i];
  const released = r >= 0
    ? `<span class="sep">|</span><span class="released">${D.dates[r].replace(/-/g,".")} 출시</span>` : "";

  el.innerHTML = `
    <input type="checkbox" ${picked.some(p=>p.id===i)?"checked":""} aria-label="${esc(title)} 순위 변동 보기">
    ${found ? "" : `<span class="rank">${rank}</span>`}
    <a href="${link}" target="_blank" rel="noopener" aria-label="${esc(title)} 상세보기">
      <img class="thumb" loading="lazy" alt="" src="${D.thumbBase}${thumb}">
    </a>
    <span class="name">
      <span class="title">
        <a href="${link}" target="_blank" rel="noopener">${esc(title)}</a>
        ${isNew ? '<span class="badge">신규</span>' : ""}
      </span>
      <span class="by">
        <a href="https://e.kakao.com/creator/${cid}" target="_blank" rel="noopener">${esc(creator)}</a>
        ${kindTags(flags)}${released}
      </span>
    </span>
    ${found ? "" : `<span>${move}</span>`}
    <a class="go" href="${link}" target="_blank" rel="noopener" aria-label="이모티콘샵에서 보기">↗</a>`;
  el.querySelector("input").onchange = () => toggle(i);
  return el;
}

function render(){
  const date = D.dates[dateIdx];
  $("todaybtn").innerHTML = `${fmt(date)}<span class="dow">${dow(date)}</span>`;
  $("prev").disabled = dateIdx === 0;
  $("next").disabled = dateIdx === D.dates.length - 1;
  document.querySelectorAll(".agebtn").forEach(b => b.setAttribute("aria-pressed", b.dataset.age === age));

  const list = $("list");
  list.innerHTML = "";

  if (query){
    const q = query.toLowerCase();
    const hits = [];
    D.items.forEach((m, i) => {
      if (m[1].toLowerCase().includes(q) || m[2].toLowerCase().includes(q)) hits.push(i);
    });
    $("ages").hidden = true;
    $("resulthead").hidden = false;
    $("resulthead").textContent = hits.length
      ? `검색 결과 ${hits.length}건` + (hits.length > MAX_FOUND ? ` (${MAX_FOUND}건까지 표시)` : "")
      : "";
    if (!hits.length) list.innerHTML = `<div class="empty">‘${esc(query)}’와 맞는 이모티콘이 없습니다.</div>`;
    else hits.slice(0, MAX_FOUND).forEach(i => list.appendChild(rowEl(i, 0, "", false, true)));
  } else {
    $("ages").hidden = false;
    $("resulthead").hidden = true;
    const cur = D.hot[age][dateIdx];
    const prev = dateIdx > 0 ? D.hot[age][dateIdx-1] : null;
    const pr = new Map();
    if (prev) prev.forEach((it, n) => pr.set(it, n+1));
    const flagged = new Set(D.newFlag[dateIdx]);
    cur.forEach((it, n) => {
      const rank = n + 1;
      let move;
      if (!prev) move = `<span class="move flat">—</span>`;
      else if (!pr.has(it)) move = `<span class="badge">진입</span>`;
      else {
        const diff = pr.get(it) - rank;
        move = diff > 0 ? `<span class="move up">▲ ${diff}</span>`
             : diff < 0 ? `<span class="move down">▼ ${-diff}</span>`
             : `<span class="move flat">—</span>`;
      }
      list.appendChild(rowEl(it, rank, move, flagged.has(it), false));
    });
  }
  drawPanel();
}

$("panelx").onclick = () => { picked = []; render(); };

/* 위아래 이동 */
$("toTop").onclick = () => window.scrollTo({ top: 0, behavior: "smooth" });
$("toBottom").onclick = () => window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });

/* 좁은 화면에서는 순위 변동이 아래쪽 시트로 뜹니다 */
$("sheettoggle").onclick = () => {
  const p = $("panel");
  p.classList.toggle("collapsed");
  $("sheettoggle").textContent = p.classList.contains("collapsed") ? "▴ 펼치기" : "▾ 접기";
  layoutSheet();
};
function layoutSheet(){
  const p = $("panel"), b = $("scrollbtns");
  const narrow = window.innerWidth <= 1000;
  if (!narrow || p.hidden){
    b.style.bottom = "16px";
    document.body.style.paddingBottom = "";
    return;
  }
  const h = p.offsetHeight;
  b.style.bottom = (h + 12) + "px";
  document.body.style.paddingBottom = (h + 20) + "px";
}
window.addEventListener("resize", layoutSheet);

function marker(x, y, shape, color, r){
  r = r || 3;
  switch (shape){
    case "square":   return `<rect x="${x-r}" y="${y-r}" width="${r*2}" height="${r*2}" fill="${color}"/>`;
    case "triangle": return `<polygon points="${x},${y-r-.6} ${x+r+.4},${y+r} ${x-r-.4},${y+r}" fill="${color}"/>`;
    case "diamond":  return `<polygon points="${x},${y-r-.8} ${x+r+.8},${y} ${x},${y+r+.8} ${x-r-.8},${y}" fill="${color}"/>`;
    case "cross":    return `<path d="M${x-r-.6} ${y}H${x+r+.6}M${x} ${y-r-.6}V${y+r+.6}" stroke="${color}" stroke-width="2.2" stroke-linecap="round"/>`;
    default:         return `<circle cx="${x}" cy="${y}" r="${r}" fill="${color}"/>`;
  }
}

/* 그래프 */
function drawPanel(){
  const on = picked.length > 0;
  $("panel").hidden = !on;
  $("main").classList.toggle("split", on);
  if (!on){ layoutSheet(); return; }

  fillPeriod();
  $("agecount").textContent = chartAges.length > 1 ? `${chartAges.length}개 선택` : chartAges[0];

  const W = 470, H = 420, L = 44, R = 12, T = 14, B = 28;
  const idxs = []; for (let k = from; k <= to; k++) idxs.push(k);
  const n = idxs.length;
  const x = j => L + (W - L - R) * (n === 1 ? .5 : j / (n - 1));
  const y = r => T + (H - T - B) * (r - 1) / 199;

  let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="선택한 이모티콘의 기간별 순위 변동">`;
  [1,25,50,75,100,125,150,175,200].forEach(r => {
    const major = r % 50 === 0 || r === 1;
    svg += `<line x1="${L}" y1="${y(r)}" x2="${W-R}" y2="${y(r)}" stroke="${major?"#dedcd6":"#eae8e2"}"/>`;
    if (major) svg += `<text x="${L-8}" y="${y(r)+4}" text-anchor="end" font-size="12" fill="#8b8985">${r}위</text>`;
  });
  const step = Math.ceil(n / 7);
  idxs.forEach((k, j) => {
    if (j % step) return;
    svg += `<text x="${x(j)}" y="${H-8}" text-anchor="middle" font-size="12" fill="#8b8985">${D.dates[k].slice(5).replace("-","/")}</text>`;
  });

  chartAges.forEach(a => {
    const ranks = {};
    D.hot[a].forEach((row, k) => row.forEach((it, i) => { (ranks[it] ||= {})[k] = i + 1; }));
    picked.forEach((p, ci) => {
      if (!p.on) return;
      const color = COLORS[ci % COLORS.length];
      let seg = [], segs = [];
      idxs.forEach((k, j) => {
        const r = ranks[p.id]?.[k];
        if (r) seg.push([x(j), y(r)]);
        else { if (seg.length) segs.push(seg); seg = []; }
      });
      if (seg.length) segs.push(seg);
      segs.forEach(s => {
        if (s.length > 1)
          svg += `<polyline points="${s.map(q=>q.join(",")).join(" ")}" fill="none" stroke="${color}" stroke-width="2" stroke-dasharray="${DASH[a]}" stroke-linejoin="round" stroke-linecap="round"/>`;
        s.forEach(q => svg += marker(q[0], q[1], SHAPES[ci % SHAPES.length], color, 3));
      });
    });
  });
  svg += `<line id="guide" x1="0" y1="${T}" x2="0" y2="${H-B}" stroke="#b8b6b0" stroke-width="1" visibility="hidden"/>`;
  svg += `</svg>`;
  $("chart").innerHTML = svg;

  $("dashkey").innerHTML = chartAges.length > 1
    ? chartAges.map(a => `<span><svg width="24" height="9" aria-hidden="true"><line x1="0" y1="4.5" x2="24" y2="4.5" stroke="#6d7175" stroke-width="2" stroke-dasharray="${DASH[a]}"/></svg> ${a}</span>`).join("")
    : "";

  $("legend").innerHTML = picked.map((p, ci) => `
    <span class="leg ${p.on ? "" : "off"}">
      <svg width="13" height="13" aria-hidden="true">${marker(6.5, 6.5, SHAPES[ci % SHAPES.length], COLORS[ci % COLORS.length], 4.2)}</svg>
      <span class="legname">${esc(meta(p.id)[1])}</span>
      <button class="legbtn" data-eye="${p.id}" title="${p.on ? "숨기기" : "표시"}">${p.on ? "👁" : "🚫"}</button>
      <button class="legbtn" data-x="${p.id}" title="빼기">✕</button>
    </span>`).join("");
  $("legend").querySelectorAll("[data-eye]").forEach(b => b.onclick = () => {
    const t = picked.find(p => p.id === +b.dataset.eye); t.on = !t.on; render();
  });
  $("legend").querySelectorAll("[data-x]").forEach(b => b.onclick = () => {
    picked = picked.filter(p => p.id !== +b.dataset.x); render();
  });

  /* 커서 올리면 순위 말풍선
     연령대나 아이템 중 한쪽이 하나면 숫자를 보여줍니다. */
  const svgEl = $("chart").querySelector("svg");
  const tip = $("tip"), guide = svgEl.querySelector("#guide");
  const shown = picked.filter(p => p.on);
  const oneAge = chartAges.length === 1;
  const oneItem = shown.length === 1;

  const ranksBy = {};
  chartAges.forEach(a => {
    const m = {};
    D.hot[a].forEach((row, k) => row.forEach((it, i) => { (m[it] ||= {})[k] = i + 1; }));
    ranksBy[a] = m;
  });
  const rankText = r => r ? r + "위" : "200위 밖";

  svgEl.onmousemove = e => {
    const box = svgEl.getBoundingClientRect();
    const px = (e.clientX - box.left) * W / box.width;
    let j = Math.round((px - L) / ((W - L - R) || 1) * (n - 1));
    j = Math.max(0, Math.min(n - 1, j));
    const k = idxs[j];

    guide.setAttribute("x1", x(j));
    guide.setAttribute("x2", x(j));
    guide.setAttribute("visibility", "visible");

    let body;
    if (!shown.length){
      body = `<div class="tiprow" style="color:var(--muted)">표시 중인 항목이 없습니다</div>`;
    } else if (oneAge){
      // 연령대 하나 → 아이템별로 표시
      body = shown.map(p => {
        const ci = picked.findIndex(q => q.id === p.id);
        return `<div class="tiprow">
          <svg width="12" height="12" aria-hidden="true">${marker(6, 6, SHAPES[ci % SHAPES.length], COLORS[ci % COLORS.length], 4)}</svg>
          <span class="v">${rankText(ranksBy[chartAges[0]][p.id]?.[k])}</span></div>`;
      }).join("");
    } else if (oneItem){
      // 아이템 하나 → 연령대별로 표시
      const p = shown[0];
      const ci = picked.findIndex(q => q.id === p.id);
      const color = COLORS[ci % COLORS.length];
      body = chartAges.map(a => `<div class="tiprow">
          <svg width="24" height="10" aria-hidden="true"><line x1="0" y1="5" x2="24" y2="5"
            stroke="${color}" stroke-width="2" stroke-dasharray="${DASH[a]}"/></svg>
          <span style="color:var(--muted)">${a}</span>
          <span class="v">${rankText(ranksBy[a][p.id]?.[k])}</span></div>`).join("");
    } else {
      body = `<div class="tiprow" style="color:var(--muted)">연령대나 이모티콘 중<br>한쪽을 하나만 고르면<br>순위가 표시됩니다</div>`;
    }
    tip.innerHTML = `<b>${D.dates[k].slice(5).replace("-", "/")}</b>${body}`;
    tip.hidden = false;

    const left = x(j) / W * box.width;
    const top = e.clientY - box.top;
    tip.style.left = Math.min(Math.max(left + 12, 0), box.width - tip.offsetWidth - 4) + "px";
    tip.style.top = Math.min(Math.max(top - tip.offsetHeight / 2, 0), box.height - tip.offsetHeight) + "px";
  };
  svgEl.onmouseleave = () => { tip.hidden = true; guide.setAttribute("visibility", "hidden"); };
  layoutSheet();
}

render();
</script>
</body>
</html>
