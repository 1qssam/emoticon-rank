<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>이모티콘 순위</title>
<link rel="icon" type="image/png" sizes="32x32" href="1qssam-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="1qssam-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="1qssam-180.png">
<meta name="description" content="카카오 이모티콘 인기 순위를 날짜별로 기록합니다. 연령대별 순위와 기간별 순위 변동을 볼 수 있습니다.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="이모티콘 순위">
<meta property="og:title" content="이모티콘 순위">
<meta property="og:description" content="카카오 이모티콘 인기 순위를 날짜별로 기록합니다. 연령대별 순위와 기간별 순위 변동을 볼 수 있습니다.">
<meta property="og:image" content="https://1qssam.github.io/emoticon-rank/1qssam-share.png">
<meta property="og:url" content="https://1qssam.github.io/emoticon-rank/">
<meta name="twitter:card" content="summary_large_image">
<style>
  :root{
    --paper:#fcfcfb; --ink:#17181a; --muted:#83878c; --line:#e7e6e1;
    --up:#d63b2f; --down:#2563c9; --flat:#b6b4ae;
    --mark:#fee500; --panel:#f5f4f0;
  }
  *{box-sizing:border-box}
  html{overflow-y:scroll}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic",sans-serif;
    font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1320px;margin:0 auto;padding:24px 20px 80px}
  header{display:flex;align-items:baseline;gap:10px;margin-bottom:18px;flex-wrap:wrap}
  .nav{margin-left:auto;display:flex;gap:14px}
  .nav a{font-size:13px;color:var(--muted);text-decoration:none}
  .nav a:hover{color:var(--ink);text-decoration:underline}
  .nav a[aria-current]{color:var(--ink);font-weight:600}
  h1{font-size:17px;font-weight:600;margin:0;letter-spacing:-.01em}
  .since{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

  .topbar{display:flex;align-items:center;gap:14px;margin-bottom:14px;flex-wrap:wrap}
  .datebar{display:flex;align-items:center;gap:8px;position:relative}
  .daynav{width:30px;height:30px;border:1px solid var(--line);background:#fff;border-radius:7px;
    cursor:pointer;font-size:14px;color:var(--ink);line-height:1}
  .daynav:disabled{color:#cfcdc7;cursor:default}
  .todaybtn{border:0;background:none;font-family:inherit;cursor:pointer;padding:2px 6px;border-radius:6px;
    font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.01em;color:var(--ink)}
  .todaybtn:hover{background:#f0efea}
  .dow{font-size:13px;color:var(--muted);font-weight:400;margin-left:4px}

  #picker{position:absolute;top:38px;left:34px;z-index:30;background:#fff;border:1px solid var(--line);
    border-radius:10px;padding:12px;box-shadow:0 8px 26px rgba(0,0,0,.1);width:266px}
  #picker input[type=date]{font-family:inherit;font-size:14px;border:1px solid var(--line);
    border-radius:7px;padding:6px 8px;width:100%;margin-bottom:10px}
  .calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
  .calhead b{font-size:13.5px;font-variant-numeric:tabular-nums}
  .calnav{width:26px;height:26px;border:1px solid var(--line);background:#fff;border-radius:6px;
    cursor:pointer;font-size:12px;line-height:1;color:var(--ink)}
  .calnav:disabled{color:#d5d3cd;cursor:default}
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
  .cal span.h{font-size:11px;color:var(--muted);text-align:center;padding:3px 0}
  .cal button{border:0;background:none;font-family:inherit;font-size:12.5px;padding:6px 0;border-radius:6px;
    cursor:pointer;color:var(--ink);font-variant-numeric:tabular-nums}
  .cal button:disabled{color:#d5d3cd;cursor:default}
  .cal button.sel{background:var(--ink);color:#fff;font-weight:600}
  .cal button:not(:disabled):not(.sel):hover{background:#f0efea}

  .search{position:relative;flex:1;min-width:200px;max-width:340px}
  .search input{width:100%;font-family:inherit;font-size:13.5px;padding:7px 28px 7px 11px;
    border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
  .search input::placeholder{color:#b3b1ab}
  .search .x{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;
    cursor:pointer;color:var(--muted);font-size:13px;padding:2px 4px;border-radius:4px}

  .ages{display:flex;gap:2px;margin-bottom:14px;flex-wrap:wrap}
  .agebtn{border:1px solid var(--line);background:#fff;padding:5px 12px;border-radius:999px;
    font-size:13px;color:var(--muted);cursor:pointer;font-family:inherit}
  .agebtn[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);font-weight:600}

  .main{display:grid;grid-template-columns:1fr;gap:22px;align-items:start}
  .main.split{grid-template-columns:minmax(0,1fr) 470px}

  .resulthead{font-size:13px;color:var(--muted);padding:2px 0 8px}
  .hint{font-size:12.5px;color:var(--muted);margin:-4px 0 12px}
  .list{border-top:1px solid var(--line)}
  .row{display:grid;grid-template-columns:22px 40px 44px 1fr auto auto;
    align-items:center;gap:10px;padding:8px 4px;border-bottom:1px solid var(--line)}
  .row.found{grid-template-columns:22px 44px 1fr auto}
  .row:hover{background:#faf9f6}
  .rank{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;text-align:right;color:#43464a}
  .thumb{width:44px;height:44px;border-radius:8px;background:#f0efea;object-fit:cover;display:block}
  .name{min-width:0}
  .title{display:block;font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
  .title a{color:inherit;text-decoration:none}
  .title a:hover{text-decoration:underline}
  .by{display:block;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .by a{color:#63676b;text-decoration:none;font-weight:500}
  .by a:hover{text-decoration:underline}
  .sep{color:#cfcdc7;margin:0 5px}
  .move{font-size:12.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
  .up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--flat)}
  .badge{font-size:11px;padding:2px 6px;border-radius:4px;background:var(--mark);
    color:#3a3400;font-weight:600;white-space:nowrap}
  .go{color:#b9b7b1;text-decoration:none;font-size:13px;padding:2px 4px}
  .go:hover{color:var(--ink)}
  .tag{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:1px 5px}
  .tag-sound{display:inline-flex;align-items:center;gap:3px}
  .sound{width:11px;height:11px;display:inline-block;vertical-align:-1px}
  .released{font-variant-numeric:tabular-nums}
  input[type=checkbox]{width:14px;height:14px;accent-color:#17181a;cursor:pointer}
  .empty{padding:44px 0;text-align:center;color:var(--muted);font-size:13.5px}

  @media (max-width:820px){
    .row{grid-template-columns:18px 26px 40px minmax(0,1fr) auto;gap:9px;padding:11px 2px;
      align-items:start}
    .row.found{grid-template-columns:18px 40px minmax(0,1fr)}
    .go{display:none}
    .rank{padding-top:1px}
    .thumb{width:40px;height:40px}
    /* 제목이 잘리지 않게 두 줄까지 풀어줍니다 */
    .title{white-space:normal;overflow:visible;line-height:1.35;
      display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .by{white-space:normal;line-height:1.45;margin-top:2px}
    .move{padding-top:2px}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>이모티콘 순위</h1>
    <span class="since" id="since"></span>
    <nav class="nav">
      <a href="index.html" aria-current="page">인기 순위</a>
      <a href="new.html">신규 이모티콘</a>
    </nav>
  </header>

  <div class="topbar">
    <div class="datebar">
      <button class="daynav" id="prev" aria-label="이전 날짜">‹</button>
      <button class="todaybtn" id="todaybtn" aria-haspopup="dialog"></button>
      <button class="daynav" id="next" aria-label="다음 날짜">›</button>
      <div id="picker" hidden>
        <input type="date" id="dateinput" aria-label="날짜 직접 입력">
        <div class="calhead">
          <button class="calnav calprev" aria-label="이전 달">‹</button>
          <b class="calmonth"></b>
          <button class="calnav calnext" aria-label="다음 달">›</button>
        </div>
        <div class="cal"></div>
      </div>
    </div>

    <div class="search">
      <input id="q" type="search" placeholder="작가명 · 상품명 검색" autocomplete="off">
      <button class="x" id="qx" hidden aria-label="검색어 지우기">✕</button>
    </div>
  </div>

  <div class="ages" id="ages"></div>
  <p class="hint">당일 출시된 이모티콘은 이 순위에 아직 반영되지 않습니다.</p>

  <div class="main" id="main">
    <div>
      <div class="resulthead" id="resulthead" hidden></div>
      <div class="list" id="list"></div>
    </div>

    <div id="panelhost"></div>
  </div>


  <footer class="foot">
    <p>카카오 이모티콘샵에 공개된 순위를 매일 기록합니다. 이미지와 이모티콘에 대한 권리는 각 저작권자에게 있습니다.</p>
    <p>인기 순위는 매일 아침, 신규 출시는 오전 중에 수집합니다. <span id="updated"></span></p>
    <p class="slot"><a href="https://litt.ly/1qssam" target="_blank" rel="noopener">원큐클래스 박원규(원큐쌤)</a></p>
  </footer>
</div>

<script src="data.js"></script>
<script src="common.js"></script>
<script src="panel.js"></script>
<script>
const D = window.DATA;
const MAX_FOUND = 120;

let dateIdx = D.dates.length - 1;
let age = D.ages[0];
let query = "";

const $ = id => document.getElementById(id);
const meta = i => D.items[i];        // [slug, 제목, 작가, 작가ID, 구분, 썸네일]
const dow = s => "일월화수목금토"[new Date(...s.split("-").map((v,i)=>i===1?v-1:+v)).getDay()];
const fmt = s => { const [y,m,d] = s.split("-"); return `${y}년 ${+m}월 ${+d}일`; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

$("since").textContent = "since " + D.dates[0].replace(/-/g,"").slice(2);
if (D.generatedAt) $("updated").textContent = `마지막 갱신 ${D.generatedAt}`;

/* 연령대 버튼 (목록용) */
D.ages.forEach(a => {
  const b = document.createElement("button");
  b.className = "agebtn"; b.textContent = a; b.dataset.age = a;
  b.onclick = () => { age = a; render(); };
  $("ages").appendChild(b);
});

/* 날짜 */
$("prev").onclick = () => { dateIdx--; render(); };
$("next").onclick = () => { dateIdx++; render(); };
initDatePicker({
  dates: D.dates, button: "todaybtn", picker: "picker",
  get: () => dateIdx,
  set: k => { dateIdx = k; render(); },
});

/* 검색 */
$("q").oninput = e => { query = e.target.value.trim(); $("qx").hidden = !query; render(); };
$("qx").onclick = () => { query = ""; $("q").value = ""; $("qx").hidden = true; render(); };

/* 목록 */
function rowEl(i, rank, move, isNew, found){
  const [slug, title, creator, cid, flags, thumb] = meta(i);
  const link = `https://e.kakao.com/t/${slug}`;
  const el = document.createElement("div");
  el.className = "row" + (found ? " found" : "");
  const r = D.release[i];
  const released = r >= 0
    ? `<span class="sep">|</span><span class="released">${D.dates[r].replace(/-/g,".")} 출시</span>` : "";

  el.innerHTML = `
    <input type="checkbox" ${RankPanel.has(i)?"checked":""} aria-label="${esc(title)} 순위 변동 보기">
    ${found ? "" : `<span class="rank">${rank}</span>`}
    <a href="${link}" target="_blank" rel="noopener" aria-label="${esc(title)} 상세보기">
      <img class="thumb" loading="lazy" alt="" src="${D.thumbBase}${thumb}">
    </a>
    <span class="name">
      <span class="title">
        <a href="${link}" target="_blank" rel="noopener">${esc(title)}</a>
        ${isNew ? '<span class="badge">신규</span>' : ""}
      </span>
      <span class="by">
        <a href="https://e.kakao.com/creator/${cid}" target="_blank" rel="noopener">${esc(creator)}</a>
        ${kindTags(flags)}${released}
      </span>
    </span>
    ${found ? "" : `<span>${move}</span>`}
    <a class="go" href="${link}" target="_blank" rel="noopener" aria-label="이모티콘샵에서 보기">↗</a>`;
  el.querySelector("input").onchange = () => RankPanel.toggle(i);
  return el;
}

function render(){
  const date = D.dates[dateIdx];
  $("todaybtn").innerHTML = `${fmt(date)}<span class="dow">${dow(date)}</span>`;
  $("prev").disabled = dateIdx === 0;
  $("next").disabled = dateIdx === D.dates.length - 1;
  document.querySelectorAll(".agebtn").forEach(b => b.setAttribute("aria-pressed", b.dataset.age === age));

  const list = $("list");
  list.innerHTML = "";

  if (query){
    const q = query.toLowerCase();
    const hits = [];
    D.items.forEach((m, i) => {
      if (m[1].toLowerCase().includes(q) || m[2].toLowerCase().includes(q)) hits.push(i);
    });
    $("ages").hidden = true;
    $("resulthead").hidden = false;
    $("resulthead").textContent = hits.length
      ? `검색 결과 ${hits.length}건` + (hits.length > MAX_FOUND ? ` (${MAX_FOUND}건까지 표시)` : "")
      : "";
    if (!hits.length) list.innerHTML = `<div class="empty">‘${esc(query)}’와 맞는 이모티콘이 없습니다.</div>`;
    else hits.slice(0, MAX_FOUND).forEach(i => list.appendChild(rowEl(i, 0, "", false, true)));
  } else {
    $("ages").hidden = false;
    $("resulthead").hidden = true;
    const cur = D.hot[age][dateIdx];
    const prev = dateIdx > 0 ? D.hot[age][dateIdx-1] : null;
    const pr = new Map();
    if (prev) prev.forEach((it, n) => pr.set(it, n+1));
    const flagged = new Set(D.newFlag[dateIdx]);
    cur.forEach((it, n) => {
      const rank = n + 1;
      let move;
      if (!prev) move = `<span class="move flat">—</span>`;
      else if (!pr.has(it)) move = `<span class="badge">진입</span>`;
      else {
        const diff = pr.get(it) - rank;
        move = diff > 0 ? `<span class="move up">▲ ${diff}</span>`
             : diff < 0 ? `<span class="move down">▼ ${-diff}</span>`
             : `<span class="move flat">—</span>`;
      }
      list.appendChild(rowEl(it, rank, move, flagged.has(it), false));
    });
  }
  RankPanel.draw();
}

RankPanel.init({ data: D, host: "panelhost", onChange: render });
render();
</script>
<script data-goatcounter="https://emoticon-rank.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
</body>
</html>
