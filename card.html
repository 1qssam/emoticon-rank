<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>캡처용 순위표 · 이모티콘 순위</title>
<meta name="robots" content="noindex">
<style>
  :root{--ink:#17181a;--muted:#8b8f93;--line:#e7e6e1;--panel:#f5f4f0}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:#f0efea}
  body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic",sans-serif;
    color:var(--ink);-webkit-font-smoothing:antialiased}
  .bar{max-width:1000px;margin:0 auto;padding:18px 16px 10px;display:flex;gap:10px;
    align-items:center;flex-wrap:wrap}
  .bar h1{font-size:15px;margin:0;font-weight:600}
  .bar .sp{flex:1}
  .bar button,.bar select{font-family:inherit;font-size:13px;border:1px solid var(--line);
    background:#fff;border-radius:7px;padding:6px 11px;cursor:pointer;color:var(--ink)}
  .bar button:hover{border-color:var(--ink)}
  .bar .note{font-size:12.5px;color:#6f7377;line-height:1.6;max-width:1000px;
    margin:0 auto;padding:0 16px 14px}
  .datebar{display:flex;align-items:center;gap:6px;position:relative}
  .daynav{width:28px;height:28px;border:1px solid var(--line);background:#fff;border-radius:7px;
    cursor:pointer;font-size:13px;line-height:1}
  .daynav:disabled{color:#cfcdc7;cursor:default}
  .todaybtn{border:0;background:none;font-family:inherit;cursor:pointer;padding:2px 6px;border-radius:6px;
    font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink);white-space:nowrap}
  #picker{position:absolute;top:34px;left:30px;z-index:30;background:#fff;border:1px solid var(--line);
    border-radius:10px;padding:12px;box-shadow:0 8px 26px rgba(0,0,0,.1);width:266px}
  #picker input[type=date]{font-family:inherit;font-size:14px;border:1px solid var(--line);
    border-radius:7px;padding:6px 8px;width:100%;margin-bottom:10px}
  .calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
  .calhead b{font-size:13.5px}
  .calnav{width:26px;height:26px;border:1px solid var(--line);background:#fff;border-radius:6px;cursor:pointer;font-size:12px}
  .calnav:disabled{color:#d5d3cd;cursor:default}
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
  .cal span.h{font-size:11px;color:var(--muted);text-align:center;padding:3px 0}
  .cal button{border:0;background:none;font-family:inherit;font-size:12.5px;padding:6px 0;border-radius:6px;cursor:pointer}
  .cal button:disabled{color:#d5d3cd;cursor:default}
  .cal button.sel{background:var(--ink);color:#fff;font-weight:600}

  /* ── 캡처 대상 ── */
  .shots{max-width:1000px;margin:0 auto;padding:0 16px 60px}
  .card{width:968px;max-width:100%;background:#fff;border:3px solid #d8d6d0;border-radius:10px;
    padding:16px 18px 12px;margin:0 auto 22px}
  .tabs{display:flex;gap:7px;margin-bottom:14px;flex-wrap:wrap}
  .tab{border:1px solid #ddd;border-radius:999px;padding:5px 14px;font-size:13.5px;color:#7e8286;background:#fff}
  .tab.on{background:#111;color:#fff;border-color:#111;font-weight:600}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:0 26px}
  .it{display:grid;grid-template-columns:56px 26px 1fr;align-items:center;gap:12px;padding:9px 2px}
  .it img{width:56px;height:56px;border-radius:9px;background:#f2f1ec;object-fit:cover;display:block}
  .it .n{font-size:15px;font-weight:600;color:#2f6fd0;text-align:right;font-variant-numeric:tabular-nums}
  .it .t{font-size:14.5px;font-weight:500;line-height:1.35;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .it .c{font-size:12.5px;color:#9a9ea2;margin-top:2px}
  .mark{text-align:right;font-size:13px;font-weight:700;color:#111;padding:8px 4px 2px}
  @media (max-width:1000px){ .card{width:100%} .grid{grid-template-columns:1fr} }
</style>
</head>
<body>

<div class="bar">
  <h1>캡처용 순위표</h1>
  <div class="datebar">
    <button class="daynav" id="prev" aria-label="이전 날짜">‹</button>
    <button class="todaybtn" id="todaybtn"></button>
    <button class="daynav" id="next" aria-label="다음 날짜">›</button>
    <div id="picker" hidden>
      <input type="date" aria-label="날짜 직접 입력">
      <div class="calhead">
        <button class="calnav calprev">‹</button><b class="calmonth"></b><button class="calnav calnext">›</button>
      </div>
      <div class="cal"></div>
    </div>
  </div>
  <label style="font-size:13px">
    <select id="topn">
      <option value="10" selected>10위까지</option>
      <option value="20">20위까지</option>
    </select>
  </label>
  <span class="sp"></span>
  <a href="post.html" style="font-size:13px;color:#6f7377">← 블로그용 텍스트</a>
</div>
<p class="note">각 카드를 캡처해서 블로그에 올리세요. 윈도우는 <b>Win + Shift + S</b>로 원하는 영역만 잘라낼 수 있습니다.</p>

<div class="shots" id="shots"></div>

<script src="data.js"></script>
<script src="common.js"></script>
<script>
const D = window.DATA;
let dateIdx = D.dates.length - 1;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const dow = s => "일월화수목금토"[new Date(...s.split("-").map((v,i)=>i===1?v-1:+v)).getDay()];
const fmt = s => { const [y,m,d] = s.split("-"); return `${y}년 ${+m}월 ${+d}일`; };

/* 연령대마다 테두리 색을 달리해 캡처본을 구분합니다 */
const EDGE = {"전체":"#d8d6d0","10대":"#f3a8c6","20대":"#f2cf6a","30대":"#8fd18f",
              "40대":"#8fb8e8","50대이상":"#b9a3e0"};

$("prev").onclick = () => { dateIdx--; render(); };
$("next").onclick = () => { dateIdx++; render(); };
$("topn").onchange = render;
initDatePicker({
  dates: D.dates, button: "todaybtn", picker: "picker",
  get: () => dateIdx, set: k => { dateIdx = k; render(); },
});

function card(age, n){
  const list = D.hot[age][dateIdx].slice(0, n);
  const half = Math.ceil(n / 2);
  const order = [];
  for (let i = 0; i < half; i++){
    order.push(list[i]);
    if (list[i + half] !== undefined) order.push(list[i + half]);
  }
  const cells = order.map(it => {
    const [slug, title, creator, cid, flags, thumb] = D.items[it];
    const rank = list.indexOf(it) + 1;
    return `<div class="it">
      <img src="${D.thumbBase}${thumb}" alt="" loading="lazy">
      <span class="n">${rank}</span>
      <span><span class="t">${esc(title)}</span><span class="c">${esc(creator)}</span></span>
    </div>`;
  }).join("");

  const tabs = D.ages.map(a =>
    `<span class="tab ${a === age ? "on" : ""}">${a === "50대이상" ? "50대 이상" : a}</span>`).join("");

  return `<div class="card" style="border-color:${EDGE[age]}">
    <div class="tabs">${tabs}</div>
    <div class="grid">${cells}</div>
    <div class="mark">원큐쌤의 이모티콘 클래스</div>
  </div>`;
}

function render(){
  const date = D.dates[dateIdx];
  $("todaybtn").innerHTML = `${fmt(date)} <span style="font-size:13px;color:#8b8f93;font-weight:400">${dow(date)}</span>`;
  $("prev").disabled = dateIdx === 0;
  $("next").disabled = dateIdx === D.dates.length - 1;
  const n = +$("topn").value;
  $("shots").innerHTML = D.ages.map(a => card(a, n)).join("");
}
render();
</script>
</body>
</html>
