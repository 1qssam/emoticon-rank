<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>캡처용 순위표 · 이모티콘 순위</title>
<meta name="robots" content="noindex">
<!-- 아랫줄(날짜·원큐쌤의 이모티콘 클래스) 글꼴: Pretendard 웹폰트 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css">
<style>
  :root{--ink:#17181a;--muted:#8b8f93;--line:#e7e6e1;--panel:#f5f4f0}
  *{box-sizing:border-box}
  [hidden]{display:none !important}
  html,body{margin:0;padding:0;background:#f0efea}
  body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic",sans-serif;
    color:var(--ink);-webkit-font-smoothing:antialiased}
  .bar{max-width:1000px;margin:0 auto;padding:18px 16px 10px;display:flex;gap:10px;
    align-items:center;flex-wrap:wrap}
  .bar h1{font-size:15px;margin:0;font-weight:600}
  .bar .sp{flex:1}
  .bar button,.bar select{font-family:inherit;font-size:13px;border:1px solid var(--line);
    background:#fff;border-radius:7px;padding:6px 11px;cursor:pointer;color:var(--ink)}
  .bar button:hover{border-color:var(--ink)}
  .modebtn.on{background:#111;color:#fff;border-color:#111;font-weight:600}
  .bar .note{font-size:12.5px;color:#6f7377;line-height:1.6;max-width:1000px;
    margin:0 auto;padding:0 16px 14px}
  .datebar{display:flex;align-items:center;gap:6px;position:relative}
  .daynav{width:28px;height:28px;border:1px solid var(--line);background:#fff;border-radius:7px;
    cursor:pointer;font-size:13px;line-height:1}
  .daynav:disabled{color:#cfcdc7;cursor:default}
  .todaybtn{border:0;background:none;font-family:inherit;cursor:pointer;padding:2px 6px;border-radius:6px;
    font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink);white-space:nowrap}
  #picker{position:absolute;top:34px;left:30px;z-index:30;background:#fff;border:1px solid var(--line);
    border-radius:10px;padding:12px;box-shadow:0 8px 26px rgba(0,0,0,.1);width:266px}
  #picker input[type=date]{font-family:inherit;font-size:14px;border:1px solid var(--line);
    border-radius:7px;padding:6px 8px;width:100%;margin-bottom:10px}
  .calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
  .calhead b{font-size:13.5px}
  .calnav{width:26px;height:26px;border:1px solid var(--line);background:#fff;border-radius:6px;cursor:pointer;font-size:12px}
  .calnav:disabled{color:#d5d3cd;cursor:default}
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
  .cal span.h{font-size:11px;color:var(--muted);text-align:center;padding:3px 0}
  .cal button{border:0;background:none;font-family:inherit;font-size:12.5px;padding:6px 0;border-radius:6px;cursor:pointer}
  .cal button:disabled{color:#d5d3cd;cursor:default}
  .cal button.sel{background:var(--ink);color:#fff;font-weight:600}

  /* ── 캡처 대상 ── */
  .shots{max-width:1000px;margin:0 auto;padding:0 16px 60px}
  .card{width:968px;max-width:100%;background:#fff;border:3px solid #ABC1D1;border-radius:0;
    padding:18px 20px 12px;margin:0 auto 22px}
  .tabs{display:flex;gap:7px;margin-bottom:14px;flex-wrap:wrap}
  .tab{border:1px solid #ddd;border-radius:999px;padding:6px 16px;font-size:14px;font-weight:500;color:#7e8286;background:#fff}
  .tab.on{background:#111;color:#fff;border-color:#111;font-weight:700}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:0 26px}
  .it{display:grid;grid-template-columns:96px 28px 1fr;align-items:center;gap:14px;padding:10px 2px}
  /* 카카오 인기순위 화면과 같게: 96칸에 72px 그림 */
  .it .box{width:96px;height:96px;background:#f5f5f5;border-radius:4px;
    display:flex;align-items:center;justify-content:center}
  .it .box img{width:72px;height:72px;object-fit:contain;display:block}
  .it .n{font-size:17px;font-weight:700;color:#2f6fd0;text-align:right;font-variant-numeric:tabular-nums}
  .it .t{font-size:16px;font-weight:700;line-height:1.35;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .it .c{font-size:13.5px;font-weight:500;color:#9a9ea2;margin-top:2px}
  .mark{display:flex;justify-content:space-between;align-items:baseline;
    font-family:"Pretendard",-apple-system,BlinkMacSystemFont,"Malgun Gothic",sans-serif;
    font-size:16px;font-weight:600;line-height:22px;color:#2b2c2e;letter-spacing:.01em;padding:12px 4px 4px}
  .mark .day{font-weight:600;font-variant-numeric:tabular-nums}
  .ncard{width:fit-content;max-width:100%;padding:18px 18px 12px}
  /* 신규 카드는 줄 수로만 크기가 정해지도록 높이를 고정합니다 (가로 688px)
     3줄 710px · 4줄 928px · 5줄 1146px · 6줄 1364px */
  .ngrid{display:grid;grid-template-columns:repeat(4,148px);grid-auto-rows:200px;gap:18px}
  .ncard .mark{height:38px}

  /* 인스타 표지: '전체' 카드 위에 색을 덮고 흰 글씨 */
  .cover{position:relative}
  .cover .veil{position:absolute;inset:-3px}          /* 테두리까지 덮음 */
  .cover .mark{visibility:hidden}                      /* 아랫줄은 흰 글씨로 다시 올림 */
  .cover .ctext{position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;color:#fff;text-align:center;
    font-family:"Pretendard",-apple-system,BlinkMacSystemFont,"Malgun Gothic",sans-serif;
    text-shadow:0 2px 14px rgba(0,0,0,.12)}
  .cover .cdate{font-size:44px;font-weight:700;letter-spacing:-.01em}
  .cover .ctitle{font-size:120px;font-weight:800;line-height:1.1;letter-spacing:-.03em;margin-top:18px}
  .cover .cmark{position:absolute;right:24px;bottom:16px;color:#fff;font-size:16px;font-weight:600;
    line-height:22px;font-family:"Pretendard",-apple-system,BlinkMacSystemFont,"Malgun Gothic",sans-serif}
  .ni{width:148px}
  .ni .box{width:148px;height:148px;background:#f5f5f5;border-radius:6px;
    display:flex;align-items:center;justify-content:center}
  .ni .box img{width:100px;height:100px;object-fit:contain;display:block}
  .ni .t{width:148px;height:22px;line-height:22px;font-size:16px;font-weight:700;margin-top:9px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ni .c{width:148px;height:18px;line-height:18px;font-size:14px;font-weight:400;color:#8a8e92;margin-top:3px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  @media (max-width:1000px){ .card{width:100%} .grid{grid-template-columns:1fr}
    .ngrid{grid-template-columns:repeat(2,148px)} }
</style>
</head>
<body>

<div class="bar">
  <h1>캡처용 순위표</h1>
  <div class="datebar">
    <button class="daynav" id="prev" aria-label="이전 날짜">‹</button>
    <button class="todaybtn" id="todaybtn"></button>
    <button class="daynav" id="next" aria-label="다음 날짜">›</button>
    <div id="picker" hidden>
      <input type="date" aria-label="날짜 직접 입력">
      <div class="calhead">
        <button class="calnav calprev">‹</button><b class="calmonth"></b><button class="calnav calnext">›</button>
      </div>
      <div class="cal"></div>
    </div>
  </div>
  <button id="tab-hot" class="modebtn on">인기순위</button>
  <button id="tab-new" class="modebtn">신규 이모티콘</button>
  <label style="font-size:13px" id="topWrap">
    <select id="topn">
      <option value="10">10위까지</option>
      <option value="20" selected>20위까지</option>
    </select>
  </label>
  <label style="font-size:13px;display:flex;align-items:center;gap:5px" id="coverWrap">표지
    <input type="color" id="coverColor" value="#ff4f8b" style="width:30px;height:28px;padding:0;border:1px solid #e7e6e1;border-radius:6px;background:#fff">
    <select id="coverAlpha">
      <option value="0.6">60%</option>
      <option value="0.7" selected>70%</option>
      <option value="0.8">80%</option>
    </select>
  </label>
  <span class="sp"></span>
  <a href="post.html" style="font-size:13px;color:#6f7377">블로그용 텍스트</a>
  <a href="export.html" style="font-size:13px;color:#6f7377;margin-left:10px">스프레드시트</a>
</div>

<div class="shots" id="shots"></div>

<script src="data.js"></script>
<script src="common.js"></script>
<script>
const D = window.DATA;
let dateIdx = D.dates.length - 1;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const dow = s => "일월화수목금토"[new Date(...s.split("-").map((v,i)=>i===1?v-1:+v)).getDay()];
const stamp = (s, what, color) =>
  `<span class="day" style="color:${color}">${s.replaceAll("-", "")} ${what}</span>`;
const fmt = s => { const [y,m,d] = s.split("-"); return `${y}년 ${+m}월 ${+d}일`; };

/* 연령대마다 테두리 색을 달리해 캡처본을 구분합니다 */
const EDGE = {"전체":"#ABC1D1","10대":"#f3a8c6","20대":"#f2cf6a","30대":"#8fd18f",
              "40대":"#8fb8e8","50대이상":"#b9a3e0"};

$("prev").onclick = () => { dateIdx--; render(); };
$("next").onclick = () => { dateIdx++; render(); };
$("topn").onchange = render;
$("coverColor").oninput = render;
$("coverAlpha").onchange = render;
let mode = "hot";
$("tab-hot").onclick = () => { mode = "hot"; render(); };
$("tab-new").onclick = () => { mode = "new"; render(); };
initDatePicker({
  dates: D.dates, button: "todaybtn", picker: "picker",
  get: () => dateIdx, set: k => { dateIdx = k; render(); },
});

function card(age, n, cover){
  const list = D.hot[age][dateIdx].slice(0, n);
  const half = Math.ceil(n / 2);
  const order = [];
  for (let i = 0; i < half; i++){
    order.push(list[i]);
    if (list[i + half] !== undefined) order.push(list[i + half]);
  }
  const cells = order.map(it => {
    const [slug, title, creator, cid, flags, thumb] = D.items[it];
    const rank = list.indexOf(it) + 1;
    return `<div class="it">
      <div class="box"><img src="${D.thumbBase}${thumb}" alt="" loading="lazy"></div>
      <span class="n">${rank}</span>
      <span><span class="t">${esc(title)}</span><span class="c">${esc(creator)}</span></span>
    </div>`;
  }).join("");

  const tabs = D.ages.map(a =>
    `<span class="tab ${a === age ? "on" : ""}">${a === "50대이상" ? "50대 이상" : a}</span>`).join("");

  return `<div class="card${cover ? " cover" : ""}" style="border-color:${EDGE[age]}">
    <div class="tabs">${tabs}</div>
    <div class="grid">${cells}</div>
    <div class="mark">${stamp(D.dates[dateIdx], "인기순위", EDGE[age])}<span>원큐쌤의 이모티콘 클래스</span></div>
    ${cover || ""}
  </div>`;
}

/* 인스타 카드뉴스 표지: '전체' 카드를 색으로 덮고 날짜·제목을 올립니다 */
function coverCard(n){
  const date = D.dates[dateIdx];
  const over = `<div class="veil" style="background:${$("coverColor").value};opacity:${$("coverAlpha").value}"></div>
    <div class="ctext">
      <div class="cdate">${fmt(date)} ${dow(date)}요일</div>
      <div class="ctitle">오늘의<br>인기순위</div>
    </div>
    <div class="cmark">원큐쌤의 이모티콘 클래스</div>`;
  return card("전체", n, over);
}

function newCard(){
  const items = [];
  D.release.forEach((r, i) => { if (r === dateIdx) items.push(i); });
  if (!items.length)
    return `<div class="card ncard" style="border-color:#ABC1D1">
      <div style="padding:40px 0;text-align:center;color:#9a9ea2">이날 출시된 이모티콘이 없습니다.</div>
    </div>`;

  const cells = items.map(i => {
    const [slug, title, creator, cid, flags, thumb] = D.items[i];
    return `<div class="ni">
      <div class="box"><img src="${D.thumbBase}${thumb}" alt="" loading="lazy"></div>
      <div class="t">${esc(title)}</div>
      <div class="c">${esc(creator)}</div>
    </div>`;
  }).join("");

  return `<div class="card ncard" style="border-color:#ABC1D1">
    <div class="ngrid">${cells}</div>
    <div class="mark">${stamp(D.dates[dateIdx], "신규출시", "#ABC1D1")}<span>원큐쌤의 이모티콘 클래스</span></div>
  </div>`;
}

function render(){
  const date = D.dates[dateIdx];
  $("todaybtn").innerHTML = `${fmt(date)} <span style="font-size:13px;color:#8b8f93;font-weight:400">${dow(date)}</span>`;
  $("prev").disabled = dateIdx === 0;
  $("next").disabled = dateIdx === D.dates.length - 1;
  $("tab-hot").classList.toggle("on", mode === "hot");
  $("tab-new").classList.toggle("on", mode === "new");
  $("topWrap").hidden = mode !== "hot";
  $("coverWrap").hidden = mode !== "hot";

  if (mode === "new"){
    $("shots").innerHTML = newCard();
    return;
  }
  const n = +$("topn").value;
  $("shots").innerHTML = D.ages.map(a => card(a, n)).join("") + coverCard(n);
}
render();
</script>
</body>
</html>
