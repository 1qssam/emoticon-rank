<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>주간 이모티콘 데이터 · 원큐쌤의 이모티콘 클래스</title>
<link rel="icon" type="image/png" sizes="32x32" href="1qssam-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="1qssam-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="1qssam-180.png">
<meta name="description" content="매주 토요일, 지난주 카카오 이모티콘 순위와 신규 상품 원자료(엑셀)와 AI 프롬프트를 올립니다.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="원큐쌤의 이모티콘 클래스">
<meta property="og:title" content="주간 이모티콘 데이터 · 원큐쌤의 이모티콘 클래스">
<meta property="og:description" content="매주 토요일, 지난주 카카오 이모티콘 순위와 신규 상품 원자료(엑셀)와 AI 프롬프트를 올립니다.">
<meta property="og:image" content="https://1qssam.github.io/emoticon-rank/1qssam-share.png">
<meta property="og:url" content="https://1qssam.github.io/emoticon-rank/plan-data.html">
<meta name="twitter:card" content="summary_large_image">
<style>
  :root{--paper:#fcfcfb;--ink:#17181a;--muted:#83878c;--line:#e7e6e1;--panel:#f5f4f0}
  *{box-sizing:border-box}
  html{overflow-y:scroll}
  html,body{margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic",sans-serif;
    font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
  .wrap{max-width:760px;margin:0 auto;padding:24px 16px 80px}
  header{display:flex;align-items:baseline;gap:10px;margin-bottom:6px;flex-wrap:wrap}
  h1{font-size:17px;font-weight:600;margin:0;letter-spacing:-.01em}
  .nav{margin-left:auto;display:flex;gap:14px}
  .nav a{font-size:13px;color:var(--muted);text-decoration:none}
  .nav a:hover{color:var(--ink);text-decoration:underline}
  .lead{font-size:13px;color:var(--muted);margin:0 0 18px}

  .list{list-style:none;margin:0;padding:0;border-top:1px solid var(--ink)}
  .list li{border-bottom:1px solid var(--line)}
  .list a{display:flex;align-items:baseline;gap:12px;padding:13px 2px;color:var(--ink);text-decoration:none}
  .list a:hover .t{text-decoration:underline}
  .list .t{flex:1;min-width:0;font-size:14.5px}
  .list .p{font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
  .list .d{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;width:80px;text-align:right}
  .empty{padding:24px 2px;color:var(--muted)}
  @media (max-width:560px){
    .list a{flex-wrap:wrap;gap:2px 10px}
    .list .t{flex-basis:100%}
    .list .d{width:auto;text-align:left}
  }

  .pager{display:flex;justify-content:center;gap:4px;margin-top:22px}
  .pager button{min-width:30px;height:30px;border:1px solid var(--line);background:#fff;border-radius:7px;
    font-family:inherit;font-size:13px;color:var(--ink);cursor:pointer;font-variant-numeric:tabular-nums}
  .pager button[aria-current]{background:var(--ink);border-color:var(--ink);color:#fff}
  .pager button:disabled{color:#cfcdc7;cursor:default}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>주간 이모티콘 데이터</h1>
    <nav class="nav"><a href="index.html">인기 순위</a></nav>
  </header>
  <p class="lead">매주 토요일, 지난주 카카오 이모티콘 순위·신규 상품 원자료(엑셀)와 AI 프롬프트를 올려요. 크티에서 판매해요.</p>
  <ul class="list" id="list"></ul>
  <div class="pager" id="pager"></div>
</div>
<script src="plan-data.js"></script>
<script>
const PER = 20;
const rows = (window.WEEKLY || []).filter(r => r.url).sort((a, b) => b.date.localeCompare(a.date));
const pages = Math.max(1, Math.ceil(rows.length / PER));
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function show(n){
  n = Math.min(Math.max(1, n), pages);
  const part = rows.slice((n - 1) * PER, n * PER);
  document.getElementById("list").innerHTML = part.length ? part.map(r =>
    `<li><a href="${esc(r.url)}" target="_blank" rel="noopener">
       <span class="t">${esc(r.title)}</span>
       <span class="p">${r.price.toLocaleString()}원</span>
       <span class="d">${r.date.replace(/-/g, ".")}</span></a></li>`).join("")
    : `<li class="empty">아직 올라온 자료가 없어요.</li>`;
  const pg = document.getElementById("pager");
  if (pages < 2) { pg.innerHTML = ""; return; }
  let h = `<button data-p="${n - 1}" ${n === 1 ? "disabled" : ""} aria-label="이전 쪽">‹</button>`;
  for (let i = 1; i <= pages; i++) h += `<button data-p="${i}" ${i === n ? 'aria-current="page"' : ""}>${i}</button>`;
  h += `<button data-p="${n + 1}" ${n === pages ? "disabled" : ""} aria-label="다음 쪽">›</button>`;
  pg.innerHTML = h;
  const u = new URL(location); n === 1 ? u.searchParams.delete("page") : u.searchParams.set("page", n);
  history.replaceState(null, "", u);
}
document.getElementById("pager").addEventListener("click", e => {
  const b = e.target.closest("button[data-p]"); if (b && !b.disabled){ show(+b.dataset.p); scrollTo(0, 0); }
});
show(+new URLSearchParams(location.search).get("page") || 1);
</script>
</body>
</html>
