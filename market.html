<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>이모티콘 시장 둘러보기 · 원큐쌤</title>
<meta name="description" content="카카오 이모티콘샵 순위·신규에 나온 이모티콘을 스타일과 연령대로 골라 보는 페이지입니다.">
<link rel="icon" type="image/png" sizes="32x32" href="1qssam-32.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css">
<style>
/* 글꼴: Pretendard (SIL 오픈폰트 라이선스). 큰 글씨 (주 사용자 50대 이상) */
  :root{--paper:#fcfcfb;--ink:#17181a;--muted:#62666b;--line:#e2e0da;--panel:#f5f4f0;--mark:#fee500}
  *{box-sizing:border-box}
  html{overflow-y:scroll}
  html,body{margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);
    font-family:"Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
  .wrap{padding:22px 28px 60px;min-width:1100px}
  header{display:flex;align-items:baseline;gap:14px;margin-bottom:14px;flex-wrap:wrap}
  h1{font-size:26px;font-weight:700;margin:0}
  header .by{font-size:16px;color:var(--muted);margin-left:auto}
  header .by a{color:var(--muted)}

  .opts{display:flex;flex-direction:column;gap:14px;margin-bottom:14px;
    padding:18px 20px;background:var(--panel);border:1px solid var(--line);border-radius:12px}
  .opts .row{display:flex;gap:14px 20px;align-items:center;flex-wrap:wrap}
  .opts .lab{font-weight:700;min-width:70px}
  .opts label{display:flex;align-items:center;gap:6px}
  .opts input[type=search]{font-family:inherit;font-size:17px;border:1.5px solid #d6d4cd;border-radius:10px;padding:8px 12px;width:300px;background:#fff}
  .opts select{font-family:inherit;font-size:17px;border:1.5px solid #d6d4cd;border-radius:10px;padding:7px 10px;background:#fff}
  .opts input[type=checkbox]{width:20px;height:20px;accent-color:#17181a;cursor:pointer}
  .chips{display:flex;flex-wrap:wrap;gap:8px;flex:1}
  .chip{border:1.5px solid #d6d4cd;background:#fff;border-radius:999px;padding:6px 15px;font-size:16px;cursor:pointer;color:var(--ink);font-family:inherit}
  .chip:hover{border-color:var(--ink)}
  .chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
  .btn{border:1.5px solid #d6d4cd;background:#fff;color:var(--ink);border-radius:10px;padding:8px 16px;font-size:16px;cursor:pointer;font-family:inherit}
  .btn:hover{border-color:var(--ink)}
  .cnt{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums}
  .sortnote{color:var(--muted);font-size:15px}

  .note{font-size:15.5px;color:var(--muted);margin:0 0 12px;line-height:1.7}
  .tablewrap{border:1px solid var(--line);border-radius:12px;background:#fff;overflow:auto}
  table{border-collapse:collapse;width:100%;font-size:16px}
  th,td{border-bottom:1px solid var(--line);padding:9px 12px;text-align:left;white-space:nowrap;vertical-align:middle}
  th{position:sticky;top:0;background:var(--panel);font-weight:700;z-index:1;cursor:pointer;user-select:none}
  th:hover{color:#000}
  th .ar{color:#9c9a94;font-size:12px;margin-left:4px}
  td.num{font-variant-numeric:tabular-nums;color:#45484c;text-align:right}
  th.num{text-align:right}
  td.tags{white-space:normal;min-width:180px;max-width:280px}
  .tg{display:inline-block;font-size:13.5px;border:1px solid var(--line);border-radius:999px;padding:1px 9px;margin:2px 4px 2px 0;cursor:pointer;background:#fff;white-space:nowrap}
  .tg:hover{border-color:var(--ink)}
  td.title{white-space:normal;min-width:200px;max-width:380px;font-weight:600;word-break:keep-all}
  td a{color:inherit;text-decoration:none}
  td a:hover{text-decoration:underline}
  .thumb{width:64px;height:64px;background:#f0efea;display:block;border-radius:6px}
  td.rn,th.rn{color:#9c9a94;text-align:right;font-variant-numeric:tabular-nums;cursor:default;width:1%}
  td.md{font-weight:700;color:#b45309}
  .empty{padding:50px 0;text-align:center;color:var(--muted)}
  button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>이모티콘 시장 둘러보기</h1>
    <span class="by">만든 사람 <a href="https://litt.ly/1qssam" target="_blank" rel="noopener">원큐쌤(@1qssam)</a></span>
  </header>

  <div class="opts">
    <div class="row">
      <input id="q" type="search" placeholder="상품명 · 작가명 · 시리즈 찾기" autocomplete="off" aria-label="찾기">
      <label>이모티콘 유형
        <select id="kind">
          <option value="">전체</option>
          <option>멈티</option><option>움티</option><option>큰티</option>
        </select>
      </label>
      <span class="lab" style="min-width:0;margin-left:10px">연령대</span>
      <span class="row" id="ageGrp" style="gap:14px"></span>
      <label title="인기 점수를 셀 기간">기간
        <select id="days">
          <option value="7">최근 7일</option><option value="14" selected>최근 14일</option>
          <option value="30">최근 30일</option><option value="0">전체</option>
        </select>
      </label>
      <label title="유명 캐릭터·연예인·애니메이션·웹툰 원작 이모티콘을 빼고, 일반 작가 작품끼리 봅니다">
        <input type="checkbox" id="noip" checked> 캐릭터·스타·애니메이션·웹툰 빼기</label>
      <button class="btn" id="reset">필터 초기화</button>
      <span class="cnt" id="cnt"></span>
    </div>
    <div class="row" style="align-items:flex-start">
      <span class="lab" style="padding-top:6px">스타일</span>
      <span class="chips" id="tags"></span>
    </div>
  </div>

  <p class="note" id="note"></p>

  <div class="tablewrap"><table id="tbl"></table></div>
</div>

<script src="data.js"></script>
<script src="tags.js"></script>
<script>
/* ════════════════════════════════════════════════
   이모티콘 시장 둘러보기 (공개)
   · 원큐쌤 전용 db.html을 줄인 공개판입니다. 키워드 파일(expr.js)은 읽지 않습니다.
   · 미니 이모티콘은 늘 뺍니다.
   · 정렬: 기본은 최근 출시순, 연령대를 고르면 그 연령대의 최근 인기 점수순 (스타일만 고르면 최근 출시순 그대로).
     인기 점수 = 기간(기본 14일) 동안 매일 (201 - 순위)를 더해 출시 다음 날부터 센 날 수(최소 3일)로 나눈 하루 평균.
     1위 200점 ~ 200위 1점, 순위에 없는 날 0점. 신작도 기존작과 같은 기준으로 비교됩니다.
     연령대를 여러 개 고르면 고른 연령대 점수를 더합니다. 안 고르면 '전체' 순위로 셉니다.
   · 캐릭터·스타·애니메이션·웹툰(IP_TAGS) 태그가 붙은 것은 처음부터 뺍니다. 체크를 풀면 같이 봅니다.
     체크를 켜면 그 태그 선택이 풀리고, 그 태그를 고르면 체크가 꺼집니다 (둘 다 켜면 결과가 비므로).
   · 주소로 미리 고를 수 있습니다: market.html?age=20대,30대&tag=직장인에게,커플에게&days=30  (IP 포함: &noip=0)
   ════════════════════════════════════════════════ */

/* 스타일 태그 — 뺄 것, 이름만 바꿔 보여줄 것
   (emoticon-class의 make/config.js에도 같은 설정이 있습니다. 바꾸면 둘 다 바꾸세요) */
const TAG_HIDE = ["다람쥐와_찍찍이", "다른_동물들", "댕댕이", "짹짹이", "냐옹이", "곰돌이", "토깽이", "펭귄", "큰이모티콘"];
const TAG_HIDE_PREFIX = ["미니_"];
const TAG_RENAME = { "커플에게": "커플용", "직장인에게": "직장인용", "학생에게": "학생용", "군인에게": "군인용",
                     "엄마_아빠에게": "엄마·아빠용", "딸_아들에게": "딸·아들용", "취미모임_회원에게": "취미모임 회원용" };
/* 태그 순서 — 묶음 순서대로, 묶음 안에서는 많이 쓰인 순. 여기 없는 새 태그는 TAG_NEW_AT번째 묶음 바로 앞에 */
const TAG_GROUPS = [
    ["까불거리는", "상냥한", "애교많은", "시크한", "정겨운", "드립치는"],                                   // 성격
    ["동글동글한", "길쭉길쭉한", "단순하게_생긴", "표정이_살아있는", "찌글찌글_짤감성", "샤방샤방한", "하찮아서_귀여워"],   // 외형
    ["뼈때리는", "말장난", "보기만해도_웃긴", "이거_완전_나잖아", "다정한_메시지", "색다른_메시지"],         // 표현 방식
    ["커플에게", "직장인에게", "취미모임_회원에게", "엄마_아빠에게", "딸_아들에게", "학생에게", "군인에게"],   // 용도
    ["내_취향을_찾아서", "매일매일_쓰기좋은"],
    ["애니메이션", "웹툰", "캐릭터", "스타"],
    ["파스텔", "비비드", "흑과백"],
  ];
const TAG_NEW_AT = 5;
const IP_TAGS = ["캐릭터", "스타", "애니메이션", "웹툰"];   // '빼기' 체크로 뺄 태그
const SHARE_MIN = 0.3;          // 연령대를 고르면: 그 연령이 차지한 비율이 30% 이상인 것
const BEFORE = "-";             // 출시일을 모르는 것 (수집 시작 전에 나온 것)
const SHOW_MAX = 500;           // 표에 그리는 최대 줄 수

const D = window.DATA;
const T = (window.TAGS || { items: {} });
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const tagLabel = t => TAG_RENAME[t] || String(t).replace(/_/g, " ");
const tagRank = t => { const g = TAG_GROUPS.findIndex(l => l.includes(t)); return g < 0 ? TAG_NEW_AT : g < TAG_NEW_AT ? g : g + 1; };
const tagHidden = t => TAG_HIDE.includes(t) || TAG_HIDE_PREFIX.some(p => String(t).startsWith(p));
const AGE = a => a === "50대이상" ? "50대 이상" : a;

function kindOf(flags){
  if (flags & 2) return "큰티";
  if (flags & 1) return (flags & 8) ? "미니움티" : "미니멈티";
  return (flags & 8) ? "움티" : "멈티";
}

/* 연령대별 최고 순위, 200위 안에 든 날 수 */
const best = {}, DAYS = {};
D.ages.forEach(a => {
  best[a] = {}; DAYS[a] = {};
  D.hot[a].forEach((row, k) => row.forEach((it, i) => {
    if (!best[a][it] || i + 1 < best[a][it][0]) best[a][it] = [i + 1, k];
    DAYS[a][it] = (DAYS[a][it] || 0) + 1;
  }));
});
const AGES5 = D.ages.slice(1);                       // 10대~50대이상
function sharesOf(i){
  let total = 0;
  AGES5.forEach(a => total += DAYS[a][i] || 0);
  if (!total) return null;
  const out = {};
  AGES5.forEach(a => out[a] = (DAYS[a][i] || 0) / total);
  return out;
}
/* 인기 점수 — 날마다 (201 - 순위)를 더해서, 출시 후 지난 날 수로 나눈 하루 평균.
   기간은 마지막 수집일부터 달력으로 N일 (0 = 전체).
   · 나누는 날 수 = 기간 안에서 출시 다음 날부터 센 수집일 수 (출시 당일 순위표에는 들어가지 않으므로).
     출시일을 모르거나 기간 전에 나온 것은 기간 전체.
   · 최소 MIN_DAYS일로 나눕니다 — 출시 하루 이틀 반짝 1위가 맨 위로 튀지 않게. */
const DAY_MS = 864e5, toTime = d => Date.parse(d + "T00:00:00Z");
const MIN_DAYS = 3;
let SCORE = {};                                      // SCORE[연령][items 번호] = 하루 평균 점수
function makeScore(n){
  const from = n ? toTime(D.dates[D.dates.length - 1]) - (n - 1) * DAY_MS : -Infinity;
  const k0 = Math.max(0, D.dates.findIndex(d => toTime(d) >= from)), last = D.dates.length - 1;
  const daysOf = it => Math.max(MIN_DAYS, last - Math.max(k0, D.release[it] + 1) + 1);   // 출시일 모름(-1)이면 k0부터
  SCORE = {};
  D.ages.forEach(a => {
    const s = SCORE[a] = {};
    D.hot[a].forEach((row, k) => {
      if (k < k0) return;
      row.forEach((it, i) => { s[it] = (s[it] || 0) + 201 - (i + 1); });
    });
    Object.keys(s).forEach(it => { s[it] /= daysOf(+it); });
  });
}
/* 순위에 처음 보인 날 (출시일 모르는 것 정렬용) */
const firstSeen = {};
D.dates.forEach((_, day) => D.ages.forEach(a => (D.hot[a][day] || []).forEach(it => {
  if (firstSeen[it] === undefined) firstSeen[it] = day;
})));

/* 한 줄 — 미니는 처음부터 뺍니다 */
const ROWS = D.items.map((m, i) => {
  const [slug, title, creator, cid, flags, thumb, series] = m;
  const v = T.items[slug] || null;
  const b = best["전체"][i];
  let ageBest = null;
  AGES5.forEach(a => { const r = best[a][i]; if (r && (!ageBest || r[0] < ageBest[1])) ageBest = [a, r[0]]; });
  return {
    i, slug, title, creator, cid, series: series || "", thumb,
    kind: kindOf(flags), sound: !!(flags & 4),
    tags: v ? v.t.map(x => x[0]) : [],
    released: D.release[i] >= 0 ? D.dates[D.release[i]] : null,
    no: D.release[i] >= 0 && (D.releaseNo || [])[i] ? D.releaseNo[i] : null,
    first: firstSeen[i] !== undefined ? firstSeen[i] : -1,
    bestRank: b ? b[0] : null,
    ageBest,
    md: !v || v.b === undefined ? "" : (v.b ? "MD추천" : ""),
    sh: sharesOf(i),
  };
}).filter(r => !r.kind.startsWith("미니"));

/* 연령대 체크박스 */
AGES5.forEach(a => {
  const l = document.createElement("label");
  l.innerHTML = `<input type="checkbox" data-age="${a}"> ${AGE(a)}`;
  $("ageGrp").appendChild(l);
});
$("ageGrp").title = `그 연령대 순위(200위)에 든 날이 10대~50대 전체의 ${Math.round(SHARE_MIN * 100)}% 이상인 이모티콘`;

/* 스타일 태그 (묶음 순서 → 많이 쓰인 순) */
const tagCount = {};
ROWS.forEach(r => r.tags.forEach(t => { tagCount[t] = (tagCount[t] || 0) + 1; }));
const TAG_LIST = Object.keys(tagCount).filter(t => !tagHidden(t)).sort((a, b) => tagRank(a) - tagRank(b) || tagCount[b] - tagCount[a]);
let TAGS_ON = [];
/* 태그 켜고 끄기 — 빼는 태그(IP_TAGS)를 켜면 '빼기' 체크를 끕니다 */
function toggleTag(t){
  if (TAGS_ON.includes(t)) TAGS_ON = TAGS_ON.filter(x => x !== t);
  else { TAGS_ON = TAGS_ON.concat(t); if (IP_TAGS.includes(t)) $("noip").checked = false; }
  sortKey = null; drawTags(); apply();
}
function drawTags(){
  $("tags").innerHTML = TAG_LIST.map(t =>
    `<button class="chip" data-tag="${esc(t)}" aria-pressed="${TAGS_ON.includes(t)}">${esc(tagLabel(t))}</button>`).join("");
  $("tags").querySelectorAll("[data-tag]").forEach(b => b.onclick = () => toggleTag(b.dataset.tag));
}

/* ── 정렬 ──
   sortKey가 null이면 자동: 연령대를 골랐으면 그 연령대 최고 순위순, 아니면 최근 출시순.
   열 제목을 누르면 그 열로 (필터를 바꾸면 다시 자동) */
let sortKey = null, asc = true, filtered = [], ages = [];
const recent = (a, b) => {                              // 최근 출시순. 출시일 모르는 것은 뒤에(순위에 늦게 보인 것부터)
  if (a.released && b.released){
    if (a.released !== b.released) return a.released < b.released ? 1 : -1;
    return (a.no ?? 1e9) - (b.no ?? 1e9);
  }
  if (a.released) return -1;
  if (b.released) return 1;
  return b.first - a.first;
};
/* 연령대 최고 순위 — 연령대를 골랐으면 고른 연령대 안에서만, 아니면 10대~50대 전체에서 [연령, 순위] */
const ageBestOf = r => {
  let out = null;
  (ages.length ? ages : AGES5).forEach(a => { const v = best[a][r.i]; if (v && (!out || v[0] < out[1])) out = [a, v[0]]; });
  return out;
};
/* 인기 점수 — 고른 연령대를 더함, 안 골랐으면 '전체' */
const scoreOf = r => (ages.length ? ages : ["전체"]).reduce((t, a) => t + (SCORE[a][r.i] || 0), 0);
const byScore = (a, b) => (scoreOf(b) - scoreOf(a)) || recent(a, b);   // 0점(기간 안에 순위에 없던 것)은 뒤로

const COLS = [
  { k: "thumb", label: "", nosort: true,
    cell: r => `<a href="https://e.kakao.com/t/${r.slug}" target="_blank" rel="noopener"><img class="thumb" loading="lazy" alt="" src="${D.thumbBase}${r.thumb}"></a>` },
  { k: "title", label: "상품명", cls: "title", cell: r => `<a href="https://e.kakao.com/t/${r.slug}" target="_blank" rel="noopener">${esc(r.title)}</a>` },
  { k: "creator", label: "작가", cell: r => `<a href="https://e.kakao.com/creator/${r.cid}" target="_blank" rel="noopener">${esc(r.creator)}</a>` },
  { k: "series", label: "시리즈", cell: r => esc(r.series) },
  { k: "kind", label: "유형", cell: r => esc(r.kind) + (r.sound ? " · 소리" : "") },
  { k: "released", label: "출시일", cls: "num", cell: r => r.released ?? BEFORE },
  { k: "score", label: "인기 점수", cls: "num", cell: r => { const v = scoreOf(r); return v ? Math.max(1, Math.round(v)).toLocaleString() : ""; } },
  { k: "bestRank", label: "최고순위", cls: "num", cell: r => r.bestRank ?? "" },
  { k: "ageBest", label: "연령대 최고", cell: r => { const v = ageBestOf(r); return v ? `${AGE(v[0])} ${v[1]}위` : ""; } },
  { k: "tags", label: "태그", cls: "tags", nosort: true,
    cell: r => r.tags.filter(t => !tagHidden(t)).map(t => `<span class="tg" data-tg="${esc(t)}" title="이 스타일로 보기">${esc(tagLabel(t))}</span>`).join("") },
  { k: "md", label: "MD추천", cls: "md", cell: r => r.md },
];
function value(r, k){
  if (k === "ageBest"){ const v = ageBestOf(r); return v ? v[1] : null; }
  if (k === "score") return scoreOf(r) || null;
  if (k === "released") return r.released ? r.released + String(r.no ?? 999).padStart(3, "0") : null;
  if (k === "md") return r.md ? 0 : 1;
  return r[k];
}

function apply(){
  const q = $("q").value.trim().toLowerCase(), kind = $("kind").value;
  ages = [...document.querySelectorAll("#ageGrp input:checked")].map(x => x.dataset.age);
  const noip = $("noip").checked;
  filtered = ROWS.filter(r => {
    if (kind && r.kind !== kind) return false;
    if (noip && r.tags.some(t => IP_TAGS.includes(t))) return false;
    if (TAGS_ON.length && !TAGS_ON.some(t => r.tags.includes(t))) return false;             // 하나라도 맞으면
    if (ages.length && (!r.sh || !ages.some(a => r.sh[a] >= SHARE_MIN))) return false;    // 하나라도 맞으면
    if (q && !(r.title.toLowerCase().includes(q) || r.creator.toLowerCase().includes(q)
               || r.series.toLowerCase().includes(q))) return false;
    return true;
  });
  if (!sortKey) filtered.sort(ages.length ? byScore : recent);
  else filtered.sort((a, b) => {
    const x = value(a, sortKey), y = value(b, sortKey);
    if (x === null || x === undefined || x === "") return 1;                              // 빈 값은 늘 뒤로
    if (y === null || y === undefined || y === "") return -1;
    if (x === y) return 0;
    return (x < y ? -1 : 1) * (asc ? 1 : -1);
  });
  render();
}

function render(){
  const head = `<th class="rn">#</th>` + COLS.map(c =>
    `<th data-k="${c.k}" class="${c.cls || ""}">${c.label}${sortKey === c.k ? `<span class="ar">${asc ? "▲" : "▼"}</span>` : ""}</th>`).join("");
  const body = filtered.slice(0, SHOW_MAX).map((r, n) =>
    `<tr><td class="rn">${n + 1}</td>` + COLS.map(c => `<td class="${c.cls || ""}">${c.cell(r)}</td>`).join("") + "</tr>").join("");
  $("tbl").innerHTML = `<thead><tr>${head}</tr></thead><tbody>${body}</tbody>` +
    (filtered.length ? "" : `<tbody><tr><td colspan="${COLS.length + 1}" class="empty">맞는 이모티콘이 없습니다.</td></tr></tbody>`);
  $("cnt").textContent = `${filtered.length.toLocaleString()}개` + (filtered.length > SHOW_MAX ? ` (표에는 ${SHOW_MAX}개까지)` : "");
  $("tbl").querySelectorAll("th[data-k]").forEach(th => th.onclick = () => {
    const k = th.dataset.k, col = COLS.find(c => c.k === k);
    if (col.nosort) return;
    if (sortKey === k) asc = !asc; else { sortKey = k; asc = !(k === "released" || k === "md" || k === "score"); }   // 출시일은 최근부터, 점수는 높은 것부터
    if (k === "md") asc = true;
    apply();
  });
  /* 표 안의 태그를 누르면 그 스타일을 켜고 끕니다 */
  $("tbl").querySelectorAll("[data-tg]").forEach(el => el.onclick = () => toggleTag(el.dataset.tg));
}

/* 주소로 미리 고르기: ?age=20대,30대&tag=직장인에게 */
(function(){
  const p = new URLSearchParams(location.search);
  const ag = (p.get("age") || "").split(",").map(s => s.trim()).filter(Boolean);
  document.querySelectorAll("#ageGrp input").forEach(x => { x.checked = ag.includes(x.dataset.age); });
  TAGS_ON = (p.get("tag") || "").split(",").map(s => s.trim()).filter(t => TAG_LIST.includes(t));
  const dy = p.get("days");
  if (dy !== null && [...$("days").options].some(o => o.value === dy)) $("days").value = dy;
  $("noip").checked = p.get("noip") !== "0" && !TAGS_ON.some(t => IP_TAGS.includes(t));
})();
makeScore(+$("days").value);

document.querySelectorAll("#ageGrp input").forEach(x => x.onchange = () => { sortKey = null; apply(); });
$("kind").onchange = () => { sortKey = null; apply(); };
$("noip").onchange = () => {
  if ($("noip").checked) TAGS_ON = TAGS_ON.filter(t => !IP_TAGS.includes(t));   // 빼는 태그를 골라 뒀으면 풉니다
  sortKey = null; drawTags(); apply();
};
$("days").onchange = () => { makeScore(+$("days").value); apply(); };     // 기간은 정렬을 그대로 두고 점수만 다시
$("q").oninput = apply;                                          // 찾기는 정렬을 바꾸지 않습니다
$("reset").onclick = () => {
  $("q").value = ""; $("kind").value = ""; $("days").value = "14"; makeScore(14); $("noip").checked = true;
  document.querySelectorAll("#ageGrp input").forEach(x => { x.checked = false; });
  TAGS_ON = []; sortKey = null; asc = true;
  drawTags(); apply();
};

const krDate = d => { const m = String(d).match(/^(\d{4})-(\d{2})-(\d{2})$/); return m ? `${m[1]}년 ${+m[2]}월 ${+m[3]}일` : d; };
$("note").innerHTML =
  `수집일 ${krDate(D.dates[0])} 이후 순위·신규 목록에 나온 이모티콘입니다 (미니 이모티콘 제외). ` +
  `대표이미지나 상품명을 누르면 이모티콘샵 상품 페이지로 연결됩니다.<br>` +
  `아무것도 고르지 않으면 신규이모티콘이 최근 출시순으로 정렬되고, 연령대를 선택하면 다른 연령대 대비 해당 연령대에 많이 판매된 이모티콘을 <b>인기 점수</b> 순으로 보여줍니다. ` +
  `인기 점수는 고른 기간 동안 매일 순위를 점수로 바꿔(1위 200점 ~ 200위 1점, 순위에 없는 날 0점) 출시 다음 날부터의 하루 평균으로 낸 값입니다. ` +
  `그래서 나온 지 얼마 안 된 이모티콘도 기존 이모티콘과 같은 기준으로 비교됩니다.<br>` +
  `처음에는 캐릭터·스타·애니메이션·웹툰 태그가 붙은 이모티콘(유명 캐릭터·연예인·원작이 있는 것)을 빼고 보여줍니다. 함께 보려면 체크를 푸세요.<br>` +
  `출시일이 '${BEFORE}'인 것은 수집을 시작하기 전에 나온 것입니다.`;

drawTags();
apply();
</script>
</body>
</html>
