<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>이모티콘 전체 목록 · 이모티콘 순위</title>
<meta name="robots" content="noindex">
<style>
  :root{--paper:#fcfcfb;--ink:#17181a;--muted:#83878c;--line:#e7e6e1;--panel:#f5f4f0;--mark:#fee500}
  *{box-sizing:border-box}
  html{overflow-y:scroll}
  html,body{margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic",sans-serif;
    font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1320px;margin:0 auto;padding:24px 20px 80px}
  header{display:flex;align-items:baseline;gap:12px;margin-bottom:14px;flex-wrap:wrap}
  h1{font-size:17px;font-weight:600;margin:0;letter-spacing:-.01em}
  header .sp{flex:1}
  header a{font-size:13px;color:var(--muted)}
  .tools{margin-left:auto;display:flex;gap:12px;flex-wrap:wrap}
  .tools a{font-size:13px;color:var(--muted);text-decoration:none}
  .tools a:hover{color:var(--ink);text-decoration:underline}
  .tools a[aria-current]{color:var(--ink);font-weight:600}


  .opts{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:10px;
    padding:12px 14px;background:var(--panel);border:1px solid var(--line);border-radius:9px}
  .opts label{display:flex;align-items:center;gap:6px;font-size:13px}
  .opts select,.opts input{font-family:inherit;font-size:13px;border:1px solid var(--line);
    border-radius:6px;padding:5px 8px;background:#fff;color:var(--ink)}
  .opts input[type=search]{width:220px}
  .cnt{font-size:12.5px;color:var(--muted);margin-left:auto;font-variant-numeric:tabular-nums}
  .btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:7px;
    padding:5px 12px;font-size:12.5px;cursor:pointer;font-family:inherit}
  .btn:hover{border-color:var(--ink)}
  .btn.done{background:var(--mark);color:#3a3400;border-color:var(--mark)}

  .note{font-size:12.5px;color:var(--muted);margin:0 0 12px}
  .tablewrap{border:1px solid var(--line);border-radius:9px;background:#fff;overflow:auto;max-height:70vh}
  table{border-collapse:collapse;font-size:12.5px;width:100%}
  th,td{border-bottom:1px solid var(--line);padding:7px 9px;text-align:left;white-space:nowrap}
  th{position:sticky;top:0;background:var(--panel);font-weight:600;z-index:1;cursor:pointer;user-select:none}
  th:hover{color:#000}
  th .ar{color:#b6b4ae;font-size:10px;margin-left:3px}
  td.num{font-variant-numeric:tabular-nums;color:#5c6064;text-align:right}
  /* 칸이 많아 표가 좁아지면 줄바꿈되는 칸이 한 글자 폭까지 찌그러집니다.
     최소 폭을 주고, 넘치면 표가 옆으로 스크롤되게 합니다. */
  td.title{white-space:normal;min-width:150px;max-width:320px;font-weight:500;word-break:keep-all}
  td.tags{white-space:normal;min-width:200px;max-width:260px;color:#5c6064}
  td a{color:inherit;text-decoration:none}
  td a:hover{text-decoration:underline}
  .thumb{width:34px;height:34px;background:#f0efea;display:block}
  .chip{display:inline-block;white-space:nowrap;font-size:11px;border:1px solid var(--line);border-radius:4px;
    padding:1px 6px;margin:1px 3px 1px 0;cursor:pointer;background:#fff}
  .chip:hover{border-color:var(--ink)}
  .empty{padding:44px 0;text-align:center;color:var(--muted)}
  button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>이모티콘 전체 목록</h1>
    <nav class="tools">
      <a href="index.html">사이트</a>
      <a href="week.html">주간정리</a>
      <a href="post.html">블로그용 텍스트</a>
      <a href="card.html">캡처용 순위표</a>
      <a href="db.html" aria-current="page">전체 목록</a>
      <a href="export.html">스프레드시트</a>
    </nav>
  </header>

  <div class="opts">
    <input id="q" type="search" placeholder="상품명 · 작가명 검색" autocomplete="off">
    <label>유형
      <select id="kind">
        <option value="">전체</option>
        <option>멈티</option><option>움티</option>
        <option>미니멈티</option><option>미니움티</option><option>큰티</option>
      </select>
    </label>
    <label>태그 <select id="tag"><option value="">전체</option></select></label>
    <label><input type="checkbox" id="onlyNew"> 수집 이후 출시분만</label>
    <label><input type="checkbox" id="onlyFree"> 월요무료만</label>
    <label><input type="checkbox" id="noMini"> 미니 제외</label>
    <label>키워드
      <select id="kwFilter">
        <option value="">전체</option>
        <option value="has">있는 것만</option>
        <option value="none">없는 것만</option>
      </select>
    </label>
    <label>날짜
      <select id="basis">
        <option value="">전체</option>
        <option value="released">출시일</option>
        <option value="first">순위 첫 등장일</option>
        <option value="seen">처음 수집된 날</option>
      </select>
    </label>
    <label><input type="date" id="dfrom" disabled></label>
    <span style="color:#b6b4ae">–</span>
    <label><input type="date" id="dto" disabled></label>
    <label><input type="checkbox" id="withhead" checked> 제목 줄 포함</label>
    <label><input type="number" id="maxrows" min="1" placeholder="전체" style="width:64px"> 행</label>
    <button class="btn" id="copy">시트로 복사</button>
    <button class="btn" id="resort">기본 정렬</button>
    <span class="cnt" id="cnt"></span>
  </div>

  <p class="note" id="note"></p>

  <div class="tablewrap"><table id="tbl"></table></div>
</div>

<script src="data.js"></script>
<script src="tags.js"></script>
<script src="expr.js"></script>
<script>
const D = window.DATA;
/* 날짜 번호 → 그날 출시 수 */
const EXPR = window.EXPR || {};   // 표현별 키워드 (expr.js). 없으면 빈 칸으로 둡니다
const DAY_COUNT = {};
D.release.forEach(r => { if (r >= 0) DAY_COUNT[r] = (DAY_COUNT[r] || 0) + 1; });
const T = (window.TAGS || {items:{}, creators:{}});

const $ = id => document.getElementById(id);
/* MD추천: 딱지 있으면 "MD", 확인했는데 없으면 빈칸, 아직 확인 전이면 "-" */
const mdOf = slug => {
  const v = T.items[slug];
  if (!v || v.b === undefined) return "-";
  return v.b ? "MD" : "";
};
const esc = s => String(s === undefined || s === null ? "" : s)
  .replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* 전체 순위에 든 적 없으면 미니 순위로 적습니다 */
const rankText = r => r.bestRank ? String(r.bestRank)
                    : r.miniRank ? `미니 ${r.miniRank}` : "";
const ageText = r => r.ageBest ? `${AGE(r.ageBest[0])} ${r.ageBest[1]}위`
                   : r.ageMini ? `미니 ${AGE(r.ageMini[0])} ${r.ageMini[1]}위` : "";

function kindOf(flags){
  if (flags & 2) return "큰티";
  if (flags & 1) return (flags & 8) ? "미니움티" : "미니멈티";
  return (flags & 8) ? "움티" : "멈티";
}

/* 연령대 이름은 짧게 적습니다 */
const AGE = a => a === "50대이상" ? "50대" : a;

/* 연령대별 최고 순위 */
const best = {};
D.ages.forEach(a => {
  best[a] = {};
  D.hot[a].forEach((row, k) => row.forEach((it, i) => {
    if (!best[a][it] || i + 1 < best[a][it][0]) best[a][it] = [i + 1, k];
  }));
});

/* 연령대별 200위 안에 든 날 수 — DAYS[연령대][항목 번호] */
const DAYS = {};
D.ages.forEach(a => {
  DAYS[a] = {};
  D.hot[a].forEach(row => row.forEach(it => { DAYS[a][it] = (DAYS[a][it] || 0) + 1; }));
});
const DAY_COLS = D.ages.map(a => ({ a, k: "days_" + a, label: AGE(a) + "일" }));

/* 미니만 따로 본 순위 (2026-09-15부터 모으기 시작했습니다) */
const bestMini = {};
D.ages.forEach(a => {
  bestMini[a] = {};
  ((D.mini || {})[a] || []).forEach((row, k) => row.forEach((it, i) => {
    if (!bestMini[a][it] || i + 1 < bestMini[a][it][0]) bestMini[a][it] = [i + 1, k];
  }));
});
/* 월요일 무료 이벤트 — 항목 번호 → 풀린 날짜들 */
const FREE = {};
Object.entries(D.free || {}).forEach(([date, nums]) =>
  nums.forEach(i => (FREE[i] = FREE[i] || []).push(date)));

/* 순위에 처음/마지막으로 보인 날 (연령대·미니 포함 어디든) */
const firstSeen = {}, lastSeen = {};
const mark = row => row.forEach(it => {
  if (firstSeen[it] === undefined) firstSeen[it] = k;
  lastSeen[it] = k;
});
let k = 0;
D.dates.forEach((_, day) => {
  k = day;
  D.ages.forEach(a => {
    mark(D.hot[a][day] || []);
    mark(((D.mini || {})[a] || [])[day] || []);
  });
});

/* 한 줄 만들기 */
const ROWS = D.items.map((m, i) => {
  const [slug, title, creator, cid, flags, thumb, series] = m;
  const v = T.items[slug] || null;
  const b = best["전체"][i];
  let ageBest = null;
  D.ages.slice(1).forEach(a => {
    const r = best[a][i];
    if (r && (!ageBest || r[0] < ageBest[1])) ageBest = [a, r[0]];
  });

  const bm = bestMini["전체"][i];
  let ageMini = null;
  D.ages.slice(1).forEach(a => {
    const r = bestMini[a][i];
    if (r && (!ageMini || r[0] < ageMini[1])) ageMini = [a, r[0]];
  });
  return {
    i, slug, title, creator, cid, series: series || "", thumb,
    kind: kindOf(flags),
    sound: (flags & 4) ? "Y" : "",
    tags: v ? v.t.map(x => x[0]) : [],
    count: v ? v.n : null,
    price: v ? Number(v.p) || null : null,
    state: v ? v.s : null,
    // 출시일은 순위 데이터 쪽이 정확합니다.
    // 첫 수집일의 신규 목록에는 그 전에 나온 것들이 섞여 있어서,
    // 태그 파일의 '처음 본 날'을 출시일로 쓰면 안 됩니다.
    released: D.release[i] >= 0 ? D.dates[D.release[i]] : null,
    no: D.release[i] >= 0 && (D.releaseNo || [])[i] ? D.releaseNo[i] : null,   // 그날 진열 순번
    dayCount: D.release[i] >= 0 ? DAY_COUNT[D.release[i]] : null,            // 그날 출시 수
    bestRank: b ? b[0] : null,
    bestDate: b ? D.dates[b[1]] : null,
    ageBest,
    miniRank: bm ? bm[0] : null,
    miniDate: bm ? D.dates[bm[1]] : null,
    ageMini,
    free: FREE[i] ? FREE[i].join(", ") : "",
    first: firstSeen[i] !== undefined ? D.dates[firstSeen[i]] : null,
    last: lastSeen[i] !== undefined ? D.dates[lastSeen[i]] : null,
    md: mdOf(slug),
    kw: EXPR[slug] ? EXPR[slug].length : 0,
    ...Object.fromEntries(DAY_COLS.map(c => [c.k, DAYS[c.a][i] || 0])),   // 200위 안에 든 날 수      // 키워드를 적어둔 표현 수 (0이면 아직 안 함)
  };
});

/* 태그 목록 채우기 */
const tagCount = {};
ROWS.forEach(r => r.tags.forEach(t => { tagCount[t] = (tagCount[t] || 0) + 1; }));
Object.keys(tagCount).sort((a, b) => tagCount[b] - tagCount[a]).forEach(t => {
  const o = document.createElement("option");
  o.value = t; o.textContent = `${t} (${tagCount[t]})`;
  $("tag").appendChild(o);
});

const COLS = [
  {k:"thumb",  label:"",       cell:r => `<a href="https://e.kakao.com/t/${r.slug}" target="_blank" rel="noopener"><img class="thumb" loading="lazy" alt="" src="${D.thumbBase}${r.thumb}"></a>`, nosort:true},
  {k:"title",  label:"상품명",  cls:"title", cell:r => `<a href="https://e.kakao.com/t/${r.slug}" target="_blank" rel="noopener">${esc(r.title)}</a>`},
  {k:"creator",label:"작가",    cell:r => `<a href="https://e.kakao.com/creator/${r.cid}" target="_blank" rel="noopener">${esc(r.creator)}</a>`},
  {k:"series", label:"시리즈",  cell:r => esc(r.series)},
  {k:"kind",   label:"유형",    cell:r => esc(r.kind) + (r.sound ? " · 소리" : "")},
  {k:"tags",   label:"태그",    cls:"tags", cell:r => r.tags.map(t => `<span class="chip" data-tag="${esc(t)}">${esc(t)}</span>`).join("")},
  {k:"count",  label:"개수",    cls:"num", cell:r => r.count ?? ""},
  {k:"price",  label:"가격",    cls:"num", cell:r => r.price ? r.price.toLocaleString() : ""},
  {k:"released",label:"출시일", cls:"num", cell:r => r.released ?? ""},
  {k:"no",     label:"순번",    cls:"num", cell:r => r.no ?? ""},
  {k:"dayCount",label:"일건",   cls:"num", cell:r => r.dayCount ?? ""},
  {k:"bestRank",label:"최고순위",cls:"num", cell:r => rankText(r)},
  {k:"ageBest",label:"연령대 최고", cell:r => ageText(r)},
  {k:"first",  label:"첫 등장", cls:"num", cell:r => r.first ?? ""},
  {k:"last",   label:"마지막 등장", cls:"num", cell:r => r.last ?? ""},
  ...DAY_COLS.map(c => ({k:c.k, label:c.label, cls:"num", desc:true, tip:`${AGE(c.a)} 순위 200위 안에 든 날 수`,
                         cell:r => r[c.k] || ""})),
  {k:"md",     label:"MD",      cell:r => r.md},
  {k:"kw",     label:"키워드",  cls:"num", cell:r => r.kw ? r.kw : ""},
  {k:"free",   label:"월요무료", cls:"num", cell:r => r.free},
];

/* 기본 정렬 — 출시일을 모르는 것을 위에 두고 순위 첫 등장일 순,
   그다음 출시일이 있는 것을 출시일 순. 새로 나온 것이 아래에 쌓입니다. */
function defaultOrder(a, b){
  const ga = a.released ? 1 : 0, gb = b.released ? 1 : 0;
  if (ga !== gb) return ga - gb;
  const x = ga ? a.released : (a.first || ""), y = gb ? b.released : (b.first || "");
  const ra = a.bestRank ?? (a.miniRank ? 1000 + a.miniRank : 9999);
  const rb = b.bestRank ?? (b.miniRank ? 1000 + b.miniRank : 9999);
  if (x === y) return ga ? (a.no ?? 1e9) - (b.no ?? 1e9) : ra - rb;   // 같은 출시일은 진열 순번대로
  return x < y ? -1 : 1;
}

let sortKey = "order", asc = true, filtered = [];

function value(r, k){
  if (k === "bestRank") return r.bestRank ?? (r.miniRank ? 1000 + r.miniRank : null);
  if (k === "ageBest") return r.ageBest ? r.ageBest[1] : (r.ageMini ? 1000 + r.ageMini[1] : null);
  if (k === "tags") return r.tags.join(",");
  if (k === "released" || k === "no") return r.released ? r.released + String(r.no ?? 999).padStart(3, "0") : null;  // 같은 날은 순번대로
  if (k === "md") return {"MD":0, "":1, "-":2}[r.md];   // MD가 위로
  return r[k];
}

function apply(){
  const q = $("q").value.trim().toLowerCase();
  const kind = $("kind").value;
  const tag = $("tag").value;
  const onlyNew = $("onlyNew").checked;
  const onlyFree = $("onlyFree").checked;
  const noMini = $("noMini").checked;
  const kwFilter = $("kwFilter").value;   // "" 전체 / has 있는 것만 / none 없는 것만

  const basis = $("basis").value;
  const dfrom = $("dfrom").value, dto = $("dto").value;
  $("dfrom").disabled = $("dto").disabled = !basis;

  const dateOf = r => basis === "released" ? r.released
                    : basis === "first"    ? r.first
                    : basis === "seen"     ? [r.released, r.first].filter(Boolean).sort()[0] || null
                    : null;

  filtered = ROWS.filter(r => {
    if (basis){
      const d = dateOf(r);
      if (!d) return false;                       // 그 날짜를 모르는 것은 뺍니다
      if (dfrom && d < dfrom) return false;
      if (dto && d > dto) return false;
    }
    if (kind && r.kind !== kind) return false;
    if (tag && !r.tags.includes(tag)) return false;
    if (onlyNew && !r.released) return false;
    if (onlyFree && !r.free) return false;
    if (noMini && r.kind.startsWith("미니")) return false;
    if (kwFilter === "has" && !r.kw) return false;
    if (kwFilter === "none" && r.kw) return false;
    if (q && !(r.title.toLowerCase().includes(q) || r.creator.toLowerCase().includes(q)
               || r.series.toLowerCase().includes(q))) return false;
    return true;
  });

  if (sortKey === "order"){
    filtered.sort((a, b) => defaultOrder(a, b) * (asc ? 1 : -1));
    render();
    return;
  }

  filtered.sort((a, b) => {
    const x = value(a, sortKey), y = value(b, sortKey);
    if (x === null || x === undefined || x === "") return 1;   // 빈 값은 항상 뒤로
    if (y === null || y === undefined || y === "") return -1;
    if (x === y) return 0;
    return (x < y ? -1 : 1) * (asc ? 1 : -1);
  });

  render();
}

function render(){
  const head = COLS.map(c =>
    `<th data-k="${c.k}"${c.tip ? ` title="${c.tip}"` : ""}>${c.label}${sortKey === c.k ? `<span class="ar">${asc ? "▲" : "▼"}</span>` : ""}</th>`).join("");

  const body = filtered.slice(0, 500).map(r =>
    "<tr>" + COLS.map(c => `<td class="${c.cls || ""}">${c.cell(r)}</td>`).join("") + "</tr>").join("");

  $("tbl").innerHTML = `<thead><tr>${head}</tr></thead><tbody>${body || ""}</tbody>`;
  if (!filtered.length)
    $("tbl").innerHTML += `<tbody><tr><td colspan="${COLS.length}" class="empty">맞는 이모티콘이 없습니다.</td></tr></tbody>`;

  $("cnt").textContent = `${filtered.length.toLocaleString()}개` +
    (filtered.length > 500 ? " (아래 표에는 500개까지, 복사는 전부)" : "");

  $("tbl").querySelectorAll("th[data-k]").forEach(th => th.onclick = () => {
    const k = th.dataset.k;
    const col = COLS.find(c => c.k === k);
    if (col.nosort) return;
    if (sortKey === k) asc = !asc; else { sortKey = k; asc = !col.desc; }   // 일수는 많은 것부터
    apply();
  });
  $("tbl").querySelectorAll(".chip").forEach(c => c.onclick = () => {
    $("tag").value = c.dataset.tag; apply();
  });
}

$("copy").onclick = async () => {
  const head = ["상품명","작가","시리즈","유형","소리","태그","개수","가격",
                "출시일","순번","일건","최고순위","최고순위일","연령대최고","첫등장","마지막등장",...DAY_COLS.map(c => c.label),"slug","링크","MD","월요무료","키워드표현수"];
  // 행 수를 적으면 위에서부터 그만큼만(제목 줄 제외). 비우면 전부
  const max = parseInt($("maxrows").value, 10);
  const pick = max > 0 ? filtered.slice(0, max) : filtered;
  const rows = pick.map(r => [
    r.title, r.creator, r.series, r.kind, r.sound, r.tags.join(", "),
    r.count ?? "", r.price ?? "", r.released ?? "", r.no ?? "", r.dayCount ?? "",
    rankText(r), r.bestDate ?? r.miniDate ?? "",
    ageText(r), r.first ?? "", r.last ?? "", ...DAY_COLS.map(c => r[c.k] || ""),
    r.slug, `https://e.kakao.com/t/${r.slug}`, r.md, r.free, r.kw || "",
  ]);
  const lines = ($("withhead").checked ? [head] : []).concat(rows);
  await navigator.clipboard.writeText(lines.map(x => x.join("\t")).join("\n"));
  $("copy").textContent = "복사됨"; $("copy").classList.add("done");
  setTimeout(() => { $("copy").textContent = "시트로 복사"; $("copy").classList.remove("done"); }, 1500);
};

["q","kind","tag","onlyNew","onlyFree","noMini","kwFilter","basis","dfrom","dto"].forEach(id => {
  $(id).oninput = apply; $(id).onchange = apply;
});
$("resort").onclick = () => { sortKey = "order"; asc = true; apply(); };

const got = Object.keys(T.items).length;
$("note").innerHTML =
  `${D.dates[0]}부터 ${D.dates.at(-1)}까지 순위·신규 목록에 한 번이라도 등장한 이모티콘 ${ROWS.length.toLocaleString()}개입니다. ` +
  `태그·개수·가격은 ${got.toLocaleString()}개까지 수집됐고 나머지는 차례로 채워집니다.`;

apply();
</script>
</body>
</html>
