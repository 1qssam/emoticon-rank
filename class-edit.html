<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>강의 일정 등록 · 이모티콘 순위</title>
<meta name="robots" content="noindex">
<style>
  :root{--paper:#fcfcfb;--ink:#17181a;--muted:#83878c;--line:#e7e6e1;--panel:#f5f4f0;--mark:#fee500}
  *{box-sizing:border-box}
  [hidden]{display:none !important}
  html{overflow-y:scroll}
  html,body{margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic",sans-serif;
    font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1200px;margin:0 auto;padding:24px 20px 80px}
  header{display:flex;align-items:baseline;gap:12px;margin-bottom:6px;flex-wrap:wrap}
  h1{font-size:17px;font-weight:600;margin:0;letter-spacing:-.01em}
  header .sp{flex:1}
  header a{font-size:13px;color:var(--muted)}
  .lead{font-size:13px;color:var(--muted);margin:0 0 18px;line-height:1.7}

  .cols{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start}

  fieldset{border:1px solid var(--line);border-radius:10px;background:#fff;
    padding:14px 16px 16px;margin:0 0 14px}
  fieldset:disabled{opacity:.5}
  legend{font-size:13px;font-weight:600;padding:0 6px;color:#43464a}
  .field{display:flex;gap:9px;align-items:center;margin-bottom:9px;flex-wrap:wrap}
  .field > label{font-size:13px;width:70px;flex:none;color:#5c6064}
  input[type=text],input[type=url],select{font-family:inherit;font-size:13.5px;
    border:1px solid var(--line);border-radius:7px;padding:7px 9px;background:#fff;color:var(--ink)}
  input[type=text],input[type=url]{flex:1;min-width:170px}
  select{cursor:pointer}
  .sub{font-size:12.5px;color:var(--muted)}

  .colors{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .swatch{width:26px;height:26px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0}
  .swatch[aria-pressed="true"]{border-color:var(--ink)}
  .swatch.plus{background:#fff;border:1px dashed #c9c7c1;color:var(--muted);font-size:15px;line-height:1}

  .dows{display:flex;gap:4px;flex-wrap:wrap}
  .dow{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 11px;
    font-size:13px;font-family:inherit;color:var(--muted);cursor:pointer}
  .dow[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);font-weight:600}

  .pickwrap{position:relative;display:inline-block}
  .pickbtn{border:1px solid var(--line);background:#fff;border-radius:7px;padding:7px 11px;
    font-size:13.5px;font-family:inherit;color:var(--ink);cursor:pointer;min-width:126px;text-align:left}
  .pickbtn:hover{border-color:var(--ink)}
  .pickbtn.none{color:#b3b1ab}
  .pick{position:absolute;top:38px;left:0;z-index:30;background:#fff;border:1px solid var(--line);
    border-radius:10px;padding:12px;box-shadow:0 8px 26px rgba(0,0,0,.12);width:250px}
  .calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
  .calhead b{font-size:13.5px}
  .calnav{width:26px;height:26px;border:1px solid var(--line);background:#fff;border-radius:6px;
    cursor:pointer;font-size:12px;line-height:1;color:var(--ink)}
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
  .cal span.h{font-size:11px;color:var(--muted);text-align:center;padding:3px 0}
  .cal button{border:0;background:none;font-family:inherit;font-size:12.5px;padding:6px 0;
    border-radius:6px;cursor:pointer;color:var(--ink)}
  .cal button:hover{background:#f0efea}
  .cal button.sel{background:var(--ink);color:#fff;font-weight:600}
  .cal button.sun{color:#c2564b} .cal button.sat{color:#3a6fb0}

  .btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;
    padding:7px 14px;font-size:13px;cursor:pointer;font-family:inherit}
  .btn:hover{border-color:var(--ink)}
  .btn.solid{background:var(--ink);color:#fff;border-color:var(--ink)}
  .btn.done{background:var(--mark);color:#3a3400;border-color:var(--mark)}
  .btn.ghost{border-color:transparent;color:var(--muted);padding:4px 8px;font-size:12.5px}
  .btn.ghost:hover{color:var(--ink)}
  .btn:disabled{opacity:.45;cursor:default;border-color:var(--line)}

  .rounds{list-style:none;margin:10px 0 0;padding:0}
  .rounds li{display:flex;gap:8px;align-items:center;padding:5px 0;flex-wrap:wrap}
  .rounds .no{font-size:12.5px;color:var(--muted);width:30px;flex:none}
  .rounds .dw{font-size:12.5px;color:var(--muted);width:18px;flex:none}
  .rounds .dash{color:var(--muted);font-size:12.5px}
  .rounds input[type=date],.rounds input[type=time]{font-family:inherit;font-size:13.5px;
    border:1px solid var(--line);border-radius:7px;padding:6px 8px;background:#fff;color:var(--ink)}
  .rounds li.clash input[type=date],.rounds li.clash input[type=time]{border-color:#c2564b}
  .clashmsg{font-size:12.5px;color:#c2564b;margin:8px 0 0;line-height:1.7}
  .none{font-size:13px;color:var(--muted);padding:8px 0}

  .preview{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px 18px;
    line-height:1.75;font-size:13.5px}
  .preview .pt{font-size:16px;font-weight:600;margin-bottom:2px}
  .preview .pm{color:var(--muted)}
  .preview .off{color:#c2564b}
  .mapbox{border:1px solid var(--line);border-radius:9px;padding:11px 12px;margin:12px 0 0;
    background:#fafaf8;display:flex;flex-direction:column;gap:8px}
  .mapbox .top{display:flex;gap:10px;align-items:center}
  .mapbox .pin{width:17px;height:17px;flex:none}
  .mapbox b{display:block;font-size:13.5px;font-weight:600}
  .mapbox .ad{font-size:12.5px;color:var(--muted)}
  .mapbox .row{display:flex;gap:6px}
  .mapbox .mini{flex:1;text-align:center;border:1px solid var(--line);background:#fff;
    border-radius:7px;padding:5px 9px;font-size:12.5px;color:var(--ink);text-decoration:none}
  .out{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;
    background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:12px;
    white-space:pre-wrap;word-break:break-all;line-height:1.6;min-height:56px}
  .acts{display:flex;gap:8px;align-items:center;margin:12px 0 8px;flex-wrap:wrap}
  .warn{font-size:12.5px;color:#c2564b;margin:6px 0 0}
  .editing{font-size:12.5px;color:#4c5054;background:#fff8dd;border:1px solid #f0e2a8;
    border-radius:8px;padding:8px 11px;margin:0 0 12px}

  /* ── 오른쪽 패널 ── */
  .side{position:sticky;top:20px;border:1px solid var(--line);border-radius:10px;background:#fff;
    padding:14px;max-height:calc(100vh - 40px);display:flex;flex-direction:column}
  .sidehead{display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .sidehead h2{font-size:14px;font-weight:600;margin:0;flex:1}
  .drop{border:1.5px dashed #cfcdc7;border-radius:9px;padding:22px 14px;text-align:center;
    color:var(--muted);font-size:13px;line-height:1.7;cursor:pointer}
  .drop.on{border-color:var(--ink);background:#faf9f6;color:var(--ink)}
  .clist{list-style:none;margin:0;padding:0;overflow:auto;flex:1}
  .clist li{border-bottom:1px solid var(--line);padding:9px 2px}
  .clist li.sel{background:#faf9f6}
  .crow{display:flex;align-items:center;gap:8px;cursor:pointer}
  .cdot{width:10px;height:10px;border-radius:50%;flex:none}
  .ym{font-size:12.5px;color:var(--muted);flex:none;font-variant-numeric:tabular-nums}
  .cname{flex:1;min-width:0;font-size:13.5px;font-weight:500;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cnum{font-size:12px;color:var(--muted);flex:none}
  .cinfo{font-size:12.5px;color:#5c6064;line-height:1.7;padding:8px 0 2px}
  .cinfo .off{color:#c2564b}
  .cbtns{display:flex;gap:6px;padding-top:6px}
  .sidefoot{padding-top:10px;margin-top:6px;border-top:1px solid var(--line);
    display:flex;gap:8px;align-items:center;flex-wrap:wrap}

  dialog{border:0;border-radius:12px;padding:0;max-width:430px;width:calc(100% - 32px);
    box-shadow:0 14px 44px rgba(0,0,0,.18);color:var(--ink)}
  dialog::backdrop{background:rgba(23,24,26,.34)}
  .sheet{padding:18px}
  .sheet h2{font-size:15px;margin:0 0 12px;font-weight:600}
  .mlist{list-style:none;margin:0 0 12px;padding:0;border-top:1px solid var(--line);
    max-height:230px;overflow:auto}
  .mlist li{display:flex;gap:8px;align-items:center;padding:7px 2px;border-bottom:1px solid var(--line)}
  .mlist .nm{flex:1;min-width:0;font-size:13.5px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mlist .ab{font-size:12.5px;color:var(--muted);flex:none;white-space:nowrap}
  .addrow{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
  .addrow input{flex:1;min-width:100px}
  .addrow .wide{flex-basis:100%}
  button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

  @media (max-width:900px){
    .cols{grid-template-columns:1fr}
    .side{position:static;max-height:none;order:-1}
    .field > label{width:100%}
    .pick{left:auto;right:0}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>강의 일정 등록</h1>
    <span class="sp"></span>
    <a href="class.html">일정 보기</a>
  </header>
  <p class="lead">오른쪽에 지금 쓰고 있는 <b>classes.js</b>를 올리고, 왼쪽에서 고치거나 새로 만든 뒤, 다시 내려받아 저장소에 덮어씁니다.</p>

  <div class="cols">
  <div>
    <p class="editing" id="editing" hidden></p>

    <fieldset id="fs1" disabled>
      <legend>강의</legend>
      <div class="field"><label for="place">장소</label>
        <select id="place"></select>
        <span class="sub" id="shortview"></span>
        <button class="btn ghost" id="placeman">목록 관리</button></div>
      <div class="field"><label for="kind">유형</label>
        <select id="kind"></select>
        <button class="btn ghost" id="kindman">목록 관리</button></div>
      <div class="field"><label for="lunch">점심시간</label>
        <select id="lunch"><option value="0" selected>없음</option><option value="60">1시간</option></select></div>
      <div class="field"><label for="link">신청 링크</label>
        <input id="link" type="url" placeholder="https://..."></div>
      <div class="field"><label>색</label><div class="colors" id="colors"></div></div>
    </fieldset>

    <fieldset id="fs2" disabled>
      <legend>회차 한 번에 만들기</legend>
      <div class="field"><label>기간</label>
        <span class="pickwrap"><button class="pickbtn none" id="from">시작일</button><div class="pick" id="from-pick" hidden></div></span>
        <span class="sub">–</span>
        <span class="pickwrap"><button class="pickbtn none" id="to">종료일</button><div class="pick" id="to-pick" hidden></div></span>
      </div>
      <div class="field"><label>요일</label><div class="dows" id="dows"></div></div>
      <div class="field"><label>시간</label>
        <span id="t1"></span> <span class="sub">~</span> <span id="t2"></span></div>
      <div class="field"><label></label>
        <button class="btn" id="make">회차 만들기</button>
        <span class="sub">기존 회차 뒤에 더해집니다</span></div>
      <p class="warn" id="makewarn" hidden></p>
    </fieldset>

    <fieldset id="fs3" disabled>
      <legend>회차 <span id="cnt" style="font-weight:400;color:var(--muted)"></span></legend>
      <ul class="rounds" id="rounds"></ul>
      <p class="clashmsg" id="clash" hidden></p>
      <div class="acts">
        <button class="btn" id="add">한 줄 추가</button>
        <button class="btn ghost" id="clear">전부 지우기</button>
      </div>
    </fieldset>

    <fieldset id="fs4" disabled>
      <legend>이렇게 보입니다</legend>
      <div class="preview" id="preview"></div>
      <div class="acts">
        <button class="btn solid" id="save">목록에 저장</button>
        <button class="btn" id="addnew">새 강의로 추가</button>
        <button class="btn ghost" id="reset">입력 비우기</button>
      </div>
      <div class="out" id="out"></div>
      <div class="acts"><button class="btn ghost" id="copy">이 강의만 글로 복사</button></div>
    </fieldset>
  </div>

  <aside class="side">
    <div class="sidehead">
      <h2>강의 목록 <span class="sub" id="listcnt"></span></h2>
      <button class="btn ghost" id="download" disabled>내려받기</button>
    </div>
    <div id="dropzone"></div>
    <ul class="clist" id="clist"></ul>
    <div class="sidefoot" id="sidefoot" hidden>
      <button class="btn ghost" id="reload">다른 파일 올리기</button>
      <span class="sub" id="dirty"></span>
    </div>
    <input type="file" id="file" accept=".js,text/javascript" hidden>
  </aside>
  </div>
</div>

<dialog id="man"><div class="sheet" id="manbody"></div></dialog>

<script src="class-format.js"></script>
<script>
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, "0");
const DOW = "일월화수목금토";
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

let LIST = null;        // 올린 파일의 강의들. null = 아직 안 올림
let editing = null;     // 고치고 있는 강의 번호
let dirty = false;      // 내려받지 않은 변경이 있는지

/* ── 파일 올리기 ───────────────────────────── */
function drawDrop(){
  $("dropzone").innerHTML = LIST
    ? ""
    : `<div class="drop" id="drop">여기에 <b>classes.js</b>를 끌어다 놓거나<br>눌러서 고르세요<br>
         <span class="sub">아직 파일이 없다면 <button class="btn ghost" id="blank">빈 목록으로 시작</button></span></div>`;
  if (LIST) return;
  const d = $("drop");
  d.onclick = e => { if (e.target.id !== "blank") $("file").click(); };
  $("blank").onclick = e => { e.stopPropagation(); LIST = []; afterLoad(); };
  ["dragenter","dragover"].forEach(t => d.addEventListener(t, e => { e.preventDefault(); d.classList.add("on"); }));
  ["dragleave","drop"].forEach(t => d.addEventListener(t, e => { e.preventDefault(); d.classList.remove("on"); }));
  d.addEventListener("drop", e => { const f = e.dataTransfer.files[0]; if (f) readFile(f); });
}
$("file").onchange = e => { const f = e.target.files[0]; if (f) readFile(f); e.target.value = ""; };

function readFile(f){
  const r = new FileReader();
  r.onload = () => {
    const text = String(r.result);
    const a = text.indexOf("["), b = text.lastIndexOf("]");
    if (a < 0 || b < a) return alert("classes.js 가 아닌 것 같습니다. window.CLASSES = [ ... ]; 가 들어 있어야 합니다.");
    try {
      LIST = JSON.parse(text.slice(a, b + 1).replace(/,(\s*[\]}])/g, "$1"));
    } catch {
      return alert("파일을 읽지 못했습니다. 쉼표가 빠졌거나 글자가 깨졌을 수 있습니다.");
    }
    if (!Array.isArray(LIST)){ LIST = null; return alert("강의 목록을 찾지 못했습니다."); }
    afterLoad();
  };
  r.readAsText(f, "utf-8");
}

function afterLoad(){
  dirty = false;
  editing = null;
  clearForm();
  ["fs1","fs2","fs3","fs4"].forEach(id => $(id).disabled = false);
  $("download").disabled = false;
  $("sidefoot").hidden = false;
  refreshLists(); drawColors(); drawDrop(); draw(); drawList();
}

$("reload").onclick = () => {
  if (dirty && !confirm("내려받지 않은 변경이 있습니다. 그래도 다른 파일을 올릴까요?")) return;
  LIST = null; editing = null;
  ["fs1","fs2","fs3","fs4"].forEach(id => $(id).disabled = true);
  $("download").disabled = true;
  $("sidefoot").hidden = true;
  drawDrop(); drawList(); markDirty(false);
};

function markDirty(v){
  dirty = v;
  $("dirty").textContent = v ? "내려받지 않은 변경 있음" : "";
}

/* ── 목록 ─────────────────────────────────── */
let opened = null;      // 개요를 펼친 강의

/* 첫 회차의 연월 네 자리 (2026-09-07 → 2609) */
function startYm(c){
  const first = (c.sessions || []).map(s => String(s).split(" ")[0]).filter(Boolean).sort()[0];
  return first ? first.slice(2, 4) + first.slice(5, 7) : "";
}

function drawList(){
  $("listcnt").textContent = LIST ? `${LIST.length}개` : "";
  if (!LIST){ $("clist").innerHTML = ""; return; }
  if (!LIST.length){
    $("clist").innerHTML = `<li><span class="sub">아직 강의가 없습니다. 왼쪽에서 만들어 ‘새 강의로 추가’를 누르세요.</span></li>`;
    return;
  }
  $("clist").innerHTML = LIST.map((c, i) => {
    const info = opened === i
      ? `<div class="cinfo">${ClassText.summary(c).lines
           .map(l => `<div class="${l.off ? "off" : ""}">${esc(l.text)}</div>`).join("")}</div>
         <div class="cbtns">
           <button class="btn" data-load="${i}">불러오기</button>
           <button class="btn ghost" data-del="${i}">삭제</button>
         </div>` : "";
    return `<li class="${editing === i ? "sel" : ""}">
      <div class="crow" data-open="${i}">
        <span class="cdot" style="background:${esc(c.color || "#ccc")}"></span>
        <span class="ym">${esc(startYm(c))}</span>
        <span class="cname">${esc(c.place)}</span>
        <span class="cnum">${(c.sessions || []).length}회</span>
      </div>${info}</li>`;
  }).join("");

  $("clist").querySelectorAll("[data-open]").forEach(el => el.onclick = () => {
    opened = opened === +el.dataset.open ? null : +el.dataset.open;
    drawList();
  });
  $("clist").querySelectorAll("[data-load]").forEach(b => b.onclick = () => loadInto(+b.dataset.load));
  $("clist").querySelectorAll("[data-del]").forEach(b => b.onclick = () => {
    const i = +b.dataset.del;
    if (!confirm(`‘${LIST[i].place}’ 강의를 목록에서 지울까요?`)) return;
    LIST.splice(i, 1);
    if (editing === i){ editing = null; clearForm(); }
    else if (editing > i) editing--;
    opened = null;
    markDirty(true); drawList(); draw();
  });
}

function loadInto(i){
  const p = LIST[i];
  editing = i; opened = null;
  place = p.place || ""; kind = p.kind || "";
  if (p.place && !places().some(x => x.name === p.place)){
    const l = readStore("place");
    l.push({ name: p.place, short: p.short || "", addr: p.addr || "", map: p.map || "" });
    writeStore("place", l);
  }
  if (p.kind && !kinds().includes(p.kind)){
    const l = readStore("kind"); l.push(p.kind); writeStore("kind", l);
  }
  $("lunch").value = String(p.lunch ?? 0);
  $("link").value = p.link || "";
  if (p.color){ color = p.color; if (!PALETTE.includes(color)) customColor = color; }
  rounds = (p.sessions || []).map(s => {
    const [d, t] = String(s).split(" ");
    const [a, b] = String(t || "10:00").split("-");
    return [d, a || "10:00", b || ""];
  });
  sortRounds();
  if (rounds.length){
    const [h, m] = rounds[0][1].split(":").map(Number); setTime("t1", h, m);
    if (rounds[0][2]){ const [h2, m2] = rounds[0][2].split(":").map(Number); setTime("t2", h2, m2); }
  }
  refreshLists(); drawColors(); draw(); drawList();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function clearForm(){
  place = kind = ""; rounds = []; picked.clear();
  $("link").value = ""; $("lunch").value = "0";
  chosen.from = chosen.to = "";
  $("from").textContent = "시작일"; $("to").textContent = "종료일";
  $("from").classList.add("none"); $("to").classList.add("none");
  document.querySelectorAll(".dow").forEach(b => b.setAttribute("aria-pressed", "false"));
  color = PALETTE[0];
  editing = null;
  refreshLists(); drawColors(); draw(); drawList();
}

/* ── 저장 ─────────────────────────────────── */
$("save").onclick = () => {
  const p = payload();
  if (!check(p)) return;
  if (editing === null){
    LIST.push(p); editing = LIST.length - 1;
  } else {
    LIST[editing] = p;
  }
  markDirty(true); drawList(); draw();
  flash($("save"), "저장됨");
};

$("addnew").onclick = () => {
  const p = payload();
  if (!check(p)) return;
  LIST.push(p); editing = LIST.length - 1;
  markDirty(true); drawList(); draw();
  flash($("addnew"), "추가됨");
};

function check(p){
  if (!p.place){ alert("장소를 골라주세요."); return false; }
  if (!p.sessions.length){ alert("회차를 하나 이상 넣어주세요."); return false; }
  const { msgs } = clashes();
  if (msgs.length && !confirm("겹치는 시간이 있습니다.\n\n" + msgs.join("\n") + "\n\n그래도 저장할까요?")) return false;
  return true;
}

function flash(b, word){
  const old = b.textContent;
  b.textContent = word; b.classList.add("done");
  setTimeout(() => { b.textContent = old; b.classList.remove("done"); }, 1400);
}

$("reset").onclick = () => {
  if (!confirm("입력란을 비울까요? 목록에 저장한 내용은 그대로입니다.")) return;
  clearForm();
};

$("copy").onclick = async () => {
  const p = payload();
  if (!p.place) return alert("장소를 골라주세요.");
  await navigator.clipboard.writeText(JSON.stringify(p));
  flash($("copy"), "복사됨");
};

/* ── 내려받기 ─────────────────────────────── */
$("download").onclick = () => {
  const body = LIST.map(c => JSON.stringify(c)).join(",\n\n");
  const text =
`/* 강의 일정
   ------------------------------------------------
   class-edit.html 에서 만들어 내려받은 파일입니다.
   손으로 고쳐도 되지만, 덩어리 사이의 쉼표를 빠뜨리지 마세요.        */

window.CLASSES = [

${body}

];
`;
  const blob = new Blob(["\uFEFF" + text], { type: "text/javascript;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "classes.js";
  a.click();
  URL.revokeObjectURL(a.href);
  markDirty(false);
};

window.onbeforeunload = () => dirty ? "" : undefined;

/* ── 장소·유형 목록 ───────────────────────── */
const KEY = { place: "1q-places", kind: "1q-kinds" };
const readStore = k => { try { return JSON.parse(localStorage.getItem(KEY[k]) || "[]"); } catch { return []; } };
const writeStore = (k, v) => { try { localStorage.setItem(KEY[k], JSON.stringify(v)); } catch {} };

function places(){
  const out = readStore("place");
  (LIST || []).forEach(c => {
    if (c.place && !out.some(p => p.name === c.place))
      out.push({ name: c.place, short: c.short || "", addr: c.addr || "", map: c.map || "" });
  });
  return out;
}
function kinds(){
  const out = readStore("kind");
  (LIST || []).forEach(c => { if (c.kind && !out.includes(c.kind)) out.push(c.kind); });
  return out;
}

let place = "", kind = "";
const PALETTE = ["#E69F00","#56B4E9","#009E73","#0072B2","#D55E00","#CC79A7","#6B7280"];
let color = PALETTE[0], customColor = "";

function fillSelect(el, list, cur, label){
  el.innerHTML = `<option value="">${label}</option>` +
    list.map(v => `<option${v === cur ? " selected" : ""}>${esc(v)}</option>`).join("") +
    `<option value="__add">+ 추가하기</option>`;
}
function refreshLists(){
  fillSelect($("place"), places().map(p => p.name), place, "고르세요");
  fillSelect($("kind"), kinds(), kind, "고르세요");
  const p = places().find(p => p.name === place);
  if (!p) { $("shortview").textContent = ""; return; }
  const bits = [];
  if (p.short) bits.push(`약어 ${p.short}`);
  bits.push(p.addr ? "주소 있음" : "주소 없음");
  bits.push(p.map ? "지도 링크 있음" : "지도 링크 없음");
  $("shortview").textContent = bits.join(" · ");
}

$("place").onchange = () => {
  if ($("place").value === "__add"){ $("place").value = place; return openMan("place", true); }
  place = $("place").value; refreshLists(); draw();
};
$("kind").onchange = () => {
  if ($("kind").value === "__add"){ $("kind").value = kind; return openMan("kind", true); }
  kind = $("kind").value; refreshLists(); draw();
};
$("placeman").onclick = () => openMan("place");
$("kindman").onclick = () => openMan("kind");

function openMan(which, adding){
  const isPlace = which === "place";
  const own = readStore(which);
  const all = isPlace ? places() : kinds();

  const rows = all.map((v, i) => {
    const name = isPlace ? v.name : v;
    const ab = isPlace ? `<span class="ab">${esc([v.short, v.addr ? "주소" : "", v.map ? "지도" : ""]
          .filter(Boolean).join(" · "))}</span>` : "";
    const mine = isPlace ? own.some(o => o.name === name) : own.includes(name);
    return `<li><span class="nm">${esc(name)}</span>${ab}
      <button class="btn ghost" data-edit="${i}">고치기</button>
      ${mine ? `<button class="btn ghost" data-del="${i}">지우기</button>`
             : `<span class="ab">쓰는 중</span>`}</li>`;
  }).join("");

  $("manbody").innerHTML = `
    <h2>${isPlace ? "장소" : "유형"} 목록</h2>
    <ul class="mlist">${rows || `<li><span class="nm sub">아직 없습니다.</span></li>`}</ul>
    <p class="sub" style="margin:-4px 0 12px">‘쓰는 중’은 목록의 강의가 쓰고 있는 이름입니다.
      여기서 고쳐도 그 강의를 다시 저장해야 예전 이름이 사라집니다.</p>
    <div class="addrow">
      <input type="text" id="newname" placeholder="${isPlace ? "동대문여성인력개발센터" : "내일배움과정"}">
      ${isPlace ? `<input type="text" id="newshort" placeholder="약어 (동대문)" style="max-width:120px">
        <input type="text" id="newaddr" class="wide" placeholder="주소 (서울 동대문구 …)">
        <input type="text" id="newmap" class="wide" placeholder="네이버 지도 링크 (https://naver.me/…)">` : ""}
      <button class="btn" id="addone">추가</button>
    </div>
    <button class="btn solid" id="manclose" style="width:100%">닫기</button>`;

  $("addone").onclick = () => {
    const name = $("newname").value.trim();
    if (!name) return;
    if (isPlace){
      const list = readStore("place");
      list.push({ name, short: ($("newshort").value || "").trim(),
                  addr: ($("newaddr").value || "").trim(), map: ($("newmap").value || "").trim() });
      writeStore("place", list);
      place = name;
    } else {
      const list = readStore("kind");
      list.push(name);
      writeStore("kind", list);
      kind = name;
    }
    refreshLists(); draw(); openMan(which);
  };
  $("manbody").querySelectorAll("[data-del]").forEach(b => b.onclick = () => {
    const name = isPlace ? all[+b.dataset.del].name : all[+b.dataset.del];
    writeStore(which, isPlace ? readStore("place").filter(o => o.name !== name)
                              : readStore("kind").filter(o => o !== name));
    if ((isPlace ? place : kind) === name){ if (isPlace) place = ""; else kind = ""; }
    refreshLists(); draw(); openMan(which);
  });
  $("manbody").querySelectorAll("[data-edit]").forEach(b => b.onclick = () => {
    const v = all[+b.dataset.edit];
    const old = isPlace ? v.name : v;
    const name = (prompt(`${isPlace ? "장소" : "유형"} 이름`, old) || "").trim();
    if (!name) return;
    let short = "", addr = "", map = "";
    if (isPlace){
      const s = prompt("약어 (달력 칸에 나옵니다)", v.short || "");
      if (s === null) return;
      short = s.trim();
      const a = prompt("주소 (팝업에 그대로 나옵니다)", v.addr || "");
      if (a === null) return;
      addr = a.trim();
      const m = prompt("네이버 지도 링크\n(네이버 지도 앱에서 공유 → 링크 복사)", v.map || "");
      if (m === null) return;
      map = m.trim();
    }
    const list = readStore(which);
    if (isPlace){
      const at = list.findIndex(o => o.name === old);
      if (at >= 0) list[at] = { name, short, addr, map }; else list.push({ name, short, addr, map });
    } else {
      const at = list.indexOf(old);
      if (at >= 0) list[at] = name; else list.push(name);
    }
    writeStore(which, list);
    if (isPlace && place === old) place = name;
    if (!isPlace && kind === old) kind = name;
    refreshLists(); draw(); openMan(which);
  });
  $("manclose").onclick = () => $("man").close();
  if (!$("man").open) $("man").showModal();
  if (adding) $("newname").focus();
}
$("man").onclick = e => { if (e.target === $("man")) $("man").close(); };

/* ── 색 ── */
function drawColors(){
  const custom = !PALETTE.includes(color);
  $("colors").innerHTML =
    PALETTE.map(hex => `<button class="swatch" style="background:${hex}" data-hex="${hex}"
      aria-pressed="${hex === color}" title="${hex}"></button>`).join("") +
    `<button class="swatch plus" id="cplus" aria-pressed="${custom}" title="직접 넣기"
       style="${custom ? `background:${esc(color)};border:2px solid var(--ink)` : ""}">${custom ? "" : "+"}</button>`;
  $("colors").querySelectorAll("[data-hex]").forEach(b => b.onclick = () => {
    color = b.dataset.hex; drawColors(); draw();
  });
  $("cplus").onclick = () => {
    const v = prompt("색 코드를 넣으세요. (예: 7B2FF7 또는 #7B2FF7)", customColor || "");
    if (v === null) return;
    const hex = "#" + v.trim().replace(/^#/, "").toLowerCase();
    if (!/^#[0-9a-f]{6}$/.test(hex)) return alert("여섯 자리 색 코드만 됩니다. 예: 7B2FF7");
    color = customColor = hex; drawColors(); draw();
  };
}

/* ── 요일 ── */
const picked = new Set();
[...DOW].forEach((d, i) => {
  const b = document.createElement("button");
  b.className = "dow"; b.textContent = d; b.setAttribute("aria-pressed", "false");
  b.onclick = () => {
    picked.has(i) ? picked.delete(i) : picked.add(i);
    b.setAttribute("aria-pressed", picked.has(i));
  };
  $("dows").appendChild(b);
});

/* ── 시각 고르기 ── */
function timePicker(host, hh, mm){
  $(host).innerHTML = `
    <select data-p="ap"><option>오전</option><option>오후</option></select>
    <select data-p="h">${Array.from({length:12}, (_, i) => `<option>${i+1}</option>`).join("")}</select>
    <span class="sub">시</span>
    <select data-p="m">${["00","10","20","30","40","50"].map(v => `<option>${v}</option>`).join("")}</select>
    <span class="sub">분</span>`;
  $(host).querySelectorAll("select").forEach(s => s.onchange = draw);
  setTime(host, hh, mm);
}
function setTime(host, hh, mm){
  const el = $(host);
  let h = hh % 12; if (h === 0) h = 12;
  el.querySelector("[data-p=ap]").value = hh >= 12 ? "오후" : "오전";
  el.querySelector("[data-p=h]").value = String(h);
  const m = pad(Math.floor(mm / 10) * 10);
  const msel = el.querySelector("[data-p=m]");
  msel.value = [...msel.options].some(o => o.value === m) ? m : "00";
}
function getTime(host){
  const el = $(host);
  let h = +el.querySelector("[data-p=h]").value % 12;
  if (el.querySelector("[data-p=ap]").value === "오후") h += 12;
  return `${pad(h)}:${el.querySelector("[data-p=m]").value}`;
}

/* ── 날짜 고르기 ── */
const chosen = { from: "", to: "" };
function datePicker(id){
  const btn = $(id), box = $(id + "-pick");
  let cur = new Date(Date.now() + 9*3600*1000).toISOString().slice(0, 7);

  btn.onclick = e => {
    e.stopPropagation();
    document.querySelectorAll(".pick").forEach(p => { if (p !== box) p.hidden = true; });
    box.hidden = !box.hidden;
    if (!box.hidden){ cur = (chosen[id] || cur).slice(0, 7); paint(); }
  };
  box.onclick = e => e.stopPropagation();

  function paint(){
    const [y, m] = cur.split("-").map(Number);
    const first = new Date(y, m-1, 1), last = new Date(y, m, 0).getDate();
    let cells = [..."일월화수목금토"].map(d => `<span class="h">${d}</span>`).join("");
    for (let i = 0; i < first.getDay(); i++) cells += `<span></span>`;
    for (let d = 1; d <= last; d++){
      const date = `${y}-${pad(m)}-${pad(d)}`;
      const w = new Date(y, m-1, d).getDay();
      cells += `<button data-d="${date}" class="${chosen[id] === date ? "sel " : ""}${w===0?"sun":w===6?"sat":""}">${d}</button>`;
    }
    box.innerHTML = `<div class="calhead">
        <button class="calnav" data-mv="-1">‹</button><b>${y}년 ${m}월</b>
        <button class="calnav" data-mv="1">›</button></div>
      <div class="cal">${cells}</div>`;
    box.querySelectorAll("[data-mv]").forEach(b => b.onclick = () => {
      let [yy, mm] = cur.split("-").map(Number);
      mm += +b.dataset.mv;
      if (mm < 1){ mm = 12; yy--; }
      if (mm > 12){ mm = 1; yy++; }
      cur = `${yy}-${pad(mm)}`; paint();
    });
    box.querySelectorAll("[data-d]").forEach(b => b.onclick = () => {
      chosen[id] = b.dataset.d;
      btn.textContent = b.dataset.d;
      btn.classList.remove("none");
      box.hidden = true;
    });
  }
}
datePicker("from"); datePicker("to");
document.addEventListener("click", () => document.querySelectorAll(".pick").forEach(p => p.hidden = true));

/* ── 회차 ── */
let rounds = [];
const sortRounds = () => rounds.sort((a, b) => (a[0]+a[1]).localeCompare(b[0]+b[1]));

$("make").onclick = () => {
  const from = chosen.from, to = chosen.to;
  const t1 = getTime("t1"), t2 = getTime("t2");
  const warn = m => { $("makewarn").textContent = m; $("makewarn").hidden = !m; };
  if (!from || !to) return warn("기간을 골라주세요.");
  if (from > to) return warn("시작일이 종료일보다 뒤입니다.");
  if (!picked.size) return warn("요일을 하나 이상 골라주세요.");
  if (t2 <= t1) return warn("종료 시각이 시작 시각보다 앞입니다.");
  warn("");

  const [fy, fm, fd] = from.split("-").map(Number);
  const [ty, tm, td] = to.split("-").map(Number);
  const end = new Date(ty, tm-1, td);
  let made = 0;
  for (let d = new Date(fy, fm-1, fd); d <= end; d.setDate(d.getDate() + 1)){
    if (!picked.has(d.getDay())) continue;
    const date = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
    if (rounds.some(r => r[0] === date && r[1] === t1)) continue;
    rounds.push([date, t1, t2]);
    made++;
  }
  sortRounds(); draw();
  if (!made) warn("그 기간에 고른 요일이 없거나, 이미 다 들어가 있습니다.");
};

$("add").onclick = () => {
  $("makewarn").hidden = true;
  const last = rounds[rounds.length - 1];
  rounds.push(last ? [last[0], last[1], last[2] || ""] : ["", getTime("t1"), getTime("t2")]);
  draw();
};
$("clear").onclick = () => { if (rounds.length && confirm("회차를 전부 지울까요?")){ rounds = []; draw(); } };

const mins = t => { const [h, m] = String(t || "0:0").split(":").map(Number); return h*60 + m; };

function clashes(){
  const mine = rounds.map(([d, a, b], i) => ({ i, d, a: mins(a), b: b ? mins(b) : mins(a) + 60 }))
                     .filter(r => r.d);
  const bad = new Set(), msgs = [];

  for (let x = 0; x < mine.length; x++){
    for (let y = x + 1; y < mine.length; y++){
      const p = mine[x], q = mine[y];
      if (p.d === q.d && p.a < q.b && q.a < p.b){
        bad.add(p.i); bad.add(q.i);
        msgs.push(`${p.d} — 이 강의 안에서 ${p.i+1}회와 ${q.i+1}회가 겹칩니다.`);
      }
    }
  }
  (LIST || []).forEach((c, ci) => {
    if (ci === editing) return;                 // 고치고 있는 그 강의는 건너뜁니다
    (c.sessions || []).forEach(s => {
      const [d, t] = String(s).split(" ");
      const [a, b] = String(t || "").split("-");
      const A = mins(a), B = b ? mins(b) : A + 60;
      mine.forEach(r => {
        if (r.d === d && r.a < B && A < r.b){
          bad.add(r.i);
          msgs.push(`${d} — ${c.place}${c.kind ? " " + c.kind : ""} 와 시간이 겹칩니다.`);
        }
      });
    });
  });
  return { bad, msgs: [...new Set(msgs)] };
}

function drawRounds(){
  $("cnt").textContent = rounds.length ? `${rounds.length}회` : "";
  if (!rounds.length){
    $("rounds").innerHTML = `<li class="none">위에서 만들거나 ‘한 줄 추가’로 넣으세요.</li>`;
    $("clash").hidden = true;
    return;
  }
  const { bad, msgs } = clashes();
  $("clash").hidden = !msgs.length;
  $("clash").innerHTML = msgs.map(m => esc(m)).join("<br>");

  $("rounds").innerHTML = rounds.map(([date, t1, t2], i) => {
    const dw = date ? DOW[new Date(...date.split("-").map((v, k) => k === 1 ? v-1 : +v)).getDay()] : "";
    return `<li class="${bad.has(i) ? "clash" : ""}">
      <span class="no">${i+1}회</span>
      <input type="date" value="${date}" data-i="${i}" data-k="0">
      <span class="dw">${dw}</span>
      <input type="time" value="${t1}" data-i="${i}" data-k="1" step="600">
      <span class="dash">–</span>
      <input type="time" value="${t2 || ""}" data-i="${i}" data-k="2" step="600">
      <button class="btn ghost" data-del="${i}">지우기</button>
    </li>`;
  }).join("");
  $("rounds").querySelectorAll("input[data-i]").forEach(el => {
    el.onchange = () => { rounds[+el.dataset.i][+el.dataset.k] = el.value; sortRounds(); draw(); };
  });
  $("rounds").querySelectorAll("[data-del]").forEach(b => {
    b.onclick = () => { rounds.splice(+b.dataset.del, 1); draw(); };
  });
}

/* ── 그리기 ── */
function payload(){
  const p = places().find(x => x.name === place);
  return {
    place, short: (p && p.short) || "", kind,
    addr: (p && p.addr) || "", map: (p && p.map) || "",
    lunch: +$("lunch").value, link: $("link").value.trim(), color,
    sessions: [...new Set(rounds.filter(r => r[0]).map(r =>
      `${r[0]} ${r[2] ? r[1] + "-" + r[2] : r[1]}`))],
  };
}

function draw(){
  drawRounds();
  const p = payload();
  const s = ClassText.summary(p);
  const mapbox = p.place ? `
    <div class="mapbox">
      <div class="top">
        <svg class="pin" viewBox="0 0 24 24" fill="#03c75a"><path d="M12 2C8.1 2 5 5.1 5 9c0 5.2 7 13 7 13s7-7.8 7-13c0-3.9-3.1-7-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>
        <span><b>${esc(p.place)}</b>
          <span class="ad">${esc(p.addr || "주소 없음 — 장소 목록에서 넣을 수 있습니다")}</span></span>
      </div>
      <div class="row">
        <span class="mini" style="${p.map ? "" : "opacity:.45"}">지도로 보기</span>
        <span class="mini" style="${p.addr ? "" : "opacity:.45"}">주소 복사</span>
      </div>
    </div>` : "";

  $("preview").innerHTML = s.lines.length
    ? `<div class="pt">${esc(p.place || "장소를 고르세요")}</div>` +
      s.lines.map(l => `<div class="${l.off ? "off" : ""}">${esc(l.text)}</div>`).join("") + mapbox
    : `<span class="pm">장소·유형과 회차를 넣으면 여기에 나옵니다.</span>`;
  $("out").textContent = (p.place || p.sessions.length)
    ? JSON.stringify(p)
    : "채우면 여기에 붙여넣을 글이 나옵니다.";

  $("editing").hidden = editing === null;
  if (editing !== null)
    $("editing").textContent = `‘${LIST[editing].place}’ 를 고치는 중입니다. ‘목록에 저장’을 누르면 이 강의가 바뀝니다.`;
  $("save").textContent = editing === null ? "목록에 저장" : "이 강의 저장";
}

$("link").oninput = draw;
$("lunch").onchange = draw;

timePicker("t1", 10, 0);
timePicker("t2", 17, 0);
drawDrop();
refreshLists();
drawColors();
draw();
drawList();
</script>
</body>
</html>
