<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>블로그용 텍스트 · 이모티콘 순위</title>
<meta name="robots" content="noindex">
<style>
  :root{--paper:#fcfcfb;--ink:#17181a;--muted:#83878c;--line:#e7e6e1;--panel:#f5f4f0;--mark:#fee500}
  *{box-sizing:border-box}
  html{overflow-y:scroll}
  html,body{margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic",sans-serif;
    font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
  .wrap{max-width:880px;margin:0 auto;padding:24px 20px 80px}
  header{display:flex;align-items:baseline;gap:10px;margin-bottom:14px;flex-wrap:wrap}
  h1{font-size:17px;font-weight:600;margin:0;letter-spacing:-.01em}
  header a{margin-left:auto;font-size:13px;color:var(--muted)}

  .tabs{display:flex;gap:5px;margin-bottom:14px}
  .tab{border:0;background:none;padding:7px 14px;border-radius:8px;font-size:13.5px;
    font-weight:500;color:var(--muted);cursor:pointer;font-family:inherit}
  .tab[aria-selected="true"]{background:var(--ink);color:#fff}

  .datebar{display:flex;align-items:center;gap:8px;margin-bottom:14px;position:relative;flex-wrap:wrap}
  .daynav{width:30px;height:30px;border:1px solid var(--line);background:#fff;border-radius:7px;
    cursor:pointer;font-size:14px;line-height:1;flex:none;color:var(--ink)}
  .daynav:disabled{color:#cfcdc7;cursor:default}
  .todaybtn{border:0;background:none;font-family:inherit;cursor:pointer;padding:2px 6px;border-radius:6px;
    font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink);white-space:nowrap}
  .todaybtn:hover{background:#f0efea}
  .dow{font-size:13px;color:var(--muted);font-weight:400;margin-left:4px}
  #picker{position:absolute;top:38px;left:34px;z-index:30;background:#fff;border:1px solid var(--line);
    border-radius:10px;padding:12px;box-shadow:0 8px 26px rgba(0,0,0,.1);width:266px}
  #picker input[type=date]{font-family:inherit;font-size:14px;border:1px solid var(--line);
    border-radius:7px;padding:6px 8px;width:100%;margin-bottom:10px}
  .calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
  .calhead b{font-size:13.5px;font-variant-numeric:tabular-nums}
  .calnav{width:26px;height:26px;border:1px solid var(--line);background:#fff;border-radius:6px;
    cursor:pointer;font-size:12px;line-height:1;color:var(--ink)}
  .calnav:disabled{color:#d5d3cd;cursor:default}
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
  .cal span.h{font-size:11px;color:var(--muted);text-align:center;padding:3px 0}
  .cal button{border:0;background:none;font-family:inherit;font-size:12.5px;padding:6px 0;
    border-radius:6px;cursor:pointer;color:var(--ink);font-variant-numeric:tabular-nums}
  .cal button:disabled{color:#d5d3cd;cursor:default}
  .cal button.sel{background:var(--ink);color:#fff;font-weight:600}

  .block{margin-bottom:20px}
  .blockhead{display:flex;align-items:center;gap:9px;margin-bottom:7px;flex-wrap:wrap}
  .blockhead h2{font-size:13.5px;margin:0;font-weight:600}
  .btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:7px;
    padding:5px 12px;font-size:12.5px;cursor:pointer;font-family:inherit}
  .btn:hover{border-color:var(--ink)}
  .btn.solid{background:var(--ink);color:#fff;border-color:var(--ink)}
  .btn.done{background:var(--mark);color:#3a3400;border-color:var(--mark)}
  .hint{font-size:12px;color:var(--muted);margin-left:auto}
  textarea{width:100%;border:1px solid var(--line);border-radius:9px;background:#fff;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;line-height:1.65;
    padding:12px 14px;color:var(--ink);resize:vertical}
  .title-box{height:56px}
  .mod{border:1px solid var(--line);border-radius:9px;background:#fff;margin-bottom:10px;overflow:hidden}
  .modhead{display:flex;align-items:center;gap:9px;padding:8px 10px 8px 14px;
    background:var(--panel);border-bottom:1px solid var(--line)}
  .modhead span{font-size:12.5px;color:var(--muted);font-weight:500}
  .modhead .btn{margin-left:auto;padding:4px 11px}
  .mod pre{margin:0;padding:12px 14px;white-space:pre-wrap;word-break:break-all;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;line-height:1.7}
  .tip{font-size:12.5px;color:var(--muted);line-height:1.75;margin-top:18px;
    padding-top:14px;border-top:1px solid var(--line)}
  button:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{
    outline:2px solid var(--ink);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>블로그용 텍스트</h1>
    <a href="card.html">캡처용 순위표 →</a>
  </header>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-rank" aria-selected="true">인기순위 글</button>
    <button class="tab" role="tab" id="tab-new" aria-selected="false">신규 이모티콘 글</button>
  </div>

  <div class="datebar">
    <button class="daynav" id="prev" aria-label="이전 날짜">‹</button>
    <button class="todaybtn" id="todaybtn" aria-haspopup="dialog"></button>
    <button class="daynav" id="next" aria-label="다음 날짜">›</button>
    <div id="picker" hidden>
      <input type="date" aria-label="날짜 직접 입력">
      <div class="calhead">
        <button class="calnav calprev" aria-label="이전 달">‹</button>
        <b class="calmonth"></b>
        <button class="calnav calnext" aria-label="다음 달">›</button>
      </div>
      <div class="cal"></div>
    </div>
  </div>

  <div class="block">
    <div class="blockhead">
      <h2>제목</h2>
      <button class="btn solid" id="copyTitle">복사</button>
    </div>
    <textarea id="title" class="title-box" readonly></textarea>
  </div>

  <div id="modules"></div>

  <p class="tip">
    한 덩어리씩 복사해서 차례로 붙여넣으세요. 주소는 항상 줄 맨 끝에 혼자 두었기 때문에
    네이버 에디터가 그 줄만 미리보기 카드로 바꿔줍니다.<br>
    인기순위 글은 <a href="card.html">캡처용 순위표</a>에서 이미지를 먼저 캡처한 뒤,
    이 본문을 아래에 붙이시면 됩니다.
  </p>
</div>

<script src="data.js"></script>
<script src="common.js"></script>
<script>
const D = window.DATA;
const SITE = "https://1qssam.github.io/emoticon-rank/";
let dateIdx = D.dates.length - 1;
let mode = "rank";

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const dow = s => "일월화수목금토"[new Date(...s.split("-").map((v,i)=>i===1?v-1:+v)).getDay()];
const fmt = s => { const [y,m,d] = s.split("-"); return `${y}년 ${+m}월 ${+d}일`; };

function kindOf(flags){
  if (flags & 2) return "큰티";
  if (flags & 1) return (flags & 8) ? "미니움티" : "미니멈티";
  return (flags & 8) ? "움티" : "멈티";
}
const KIND_ORDER = ["멈티", "움티", "미니멈티", "미니움티", "큰티"];
const KIND_FULL = {"멈티":"멈춰있는 이모티콘", "움티":"움직이는 이모티콘",
                   "미니멈티":"미니 멈춰있는 이모티콘", "미니움티":"미니 움직이는 이모티콘",
                   "큰티":"큰 이모티콘"};

/* 태그 — 기본 묶음 + 그날 나온 종류만 덧붙입니다 */
const TAG_BASE = ["신규이모티콘", "최신이모티콘", "카카오톡이모티콘출시",
                  "이모티콘출시", "이모티콘추천", "이모티콘트렌드"];
const TAG_KIND = {
  "멈티":     ["멈춰있는이모티콘", "멈티"],
  "움티":     ["움직이는이모티콘", "움티"],
  "미니멈티": ["멈춰있는미니이모티콘", "미니멈티"],
  "미니움티": ["움직이는미니이모티콘", "미니움티"],
  "큰티":     ["큰이모티콘"],
};

$("prev").onclick = () => { dateIdx--; render(); };
$("next").onclick = () => { dateIdx++; render(); };
$("tab-rank").onclick = () => { mode = "rank"; render(); };
$("tab-new").onclick = () => { mode = "new"; render(); };
initDatePicker({
  dates: D.dates, button: "todaybtn", picker: "picker",
  get: () => dateIdx, set: k => { dateIdx = k; render(); },
});

/* ── 인기순위 글 ── */
function rankModules(date){
  const d = fmt(date), w = dow(date);
  const title = `${d} ${w}요일 카카오 이모티콘 인기순위 TOP20 (전체/10대/20대/30대/40대/50대 이상)`;
  const intro =
`${d} ${w}요일 기준, 카카오톡 이모티콘 인기순위를
전체 및 연령대별(10대/20대/30대/40대/50대 이상)로 정리해드립니다.
인기순위는 매일 바뀌기 때문에, 오늘의 순위를 기록으로 남겨둡니다.
예비 작가님, 이모티콘 지망생이라면 요즘 어떤 스타일이 인기 있는지
참고하시고 트렌드를 확인해보세요.

* 당일 출시된 이모티콘은 순위에 집계되지 않습니다.
* 신규 이모티콘은 출시 다음날부터 인기 순위에 집계됩니다.`;
  const outro =
`전체 200위까지의 순위와 이모티콘별 순위 변동 그래프는
${SITE}
에서 더 많은 정보를 확인하실 수 있습니다.`;
  return { title, mods: [
    { label: "머리말", text: intro },
    { label: "순위표 이미지 자리", text: "(캡처한 순위표 이미지 6장을 여기에 넣으세요)", skip: true },
    { label: "맺음말", text: outro },
  ]};
}

/* ── 신규 이모티콘 글 ── */
function newModules(date){
  const d = fmt(date), w = dow(date);
  const items = [];
  D.release.forEach((r, i) => { if (r === dateIdx) items.push(i); });

  const title = `${d} ${w}요일 신규 출시 카카오톡 이모티콘 총정리 (움직이는/멈춰있는/미니)`;

  if (!items.length){
    return { title, mods: [{ label: "본문",
      text: `${d} ${w}요일에는 새로 출시된 이모티콘이 없습니다.` }] };
  }

  const c = {};
  items.forEach(i => { const k = kindOf(D.items[i][4]); c[k] = (c[k] || 0) + 1; });
  const counts = KIND_ORDER.filter(k => c[k]).map(k => `${KIND_FULL[k]} ${c[k]}건`).join("\n");

  const head =
`${d} ${w}요일 카카오톡에 새로 출시된
신규 이모티콘을 정리해드립니다.

오늘 출시 ${items.length}건
${counts}`;

  const names = items.map(i => {
    const [slug, t, creator, cid, flags] = D.items[i];
    return `${t}(${creator}) ${kindOf(flags)}`;
  }).join("\n");

  const links = items.map(i => `https://e.kakao.com/t/${D.items[i][0]}`).join("\n");

  /* 태그 */
  const tags = [...TAG_BASE];
  KIND_ORDER.forEach(k => { if (c[k]) tags.push(...TAG_KIND[k]); });
  if (items.some(i => D.items[i][4] & 4)) tags.push("소리나는이모티콘");
  if (dow(date) === "월") tags.push("월요일무료");

  const mods = [
    { label: "머리말", text: head },
    { label: `이모티콘 목록 ${items.length}줄`, text: names },
    { label: `링크 ${items.length}줄 · 위 목록과 같은 순서`, text: links },
    { label: `태그 ${tags.length}개`, text: tags.map(t => "#" + t).join(", ") },
  ];

  mods.push({ label: "맺음말", text:
`이모티콘 이름을 누르면 이모티콘샵으로 바로 이동합니다.
출시일별 기록과 인기순위는
${SITE}
에서 더 많은 정보를 확인하실 수 있습니다.` });

  return { title, mods };
}

function render(){
  const date = D.dates[dateIdx];
  $("todaybtn").innerHTML = `${fmt(date)}<span class="dow">${dow(date)}</span>`;
  $("prev").disabled = dateIdx === 0;
  $("next").disabled = dateIdx === D.dates.length - 1;
  $("tab-rank").setAttribute("aria-selected", mode === "rank");
  $("tab-new").setAttribute("aria-selected", mode === "new");

  const post = mode === "rank" ? rankModules(date) : newModules(date);
  $("title").value = post.title;

  $("modules").innerHTML = post.mods.map((m, k) => `
    <div class="mod">
      <div class="modhead">
        <span>${esc(m.label)}</span>
        ${m.skip ? "" : `<button class="btn" data-k="${k}">복사</button>`}
      </div>
      <pre id="mod${k}">${esc(m.text)}</pre>
    </div>`).join("");

  $("modules").querySelectorAll("button[data-k]").forEach(b => b.onclick = async () => {
    await navigator.clipboard.writeText($("mod" + b.dataset.k).textContent);
    flash(b);
  });
}

/* ── 복사 ── */
function flash(btn){
  const old = btn.textContent;
  btn.textContent = "복사됨";
  btn.classList.add("done");
  setTimeout(() => { btn.textContent = old; btn.classList.remove("done"); }, 1500);
}
$("copyTitle").onclick = async () => {
  await navigator.clipboard.writeText($("title").value);
  flash($("copyTitle"));
};
render();
</script>
</body>
</html>
